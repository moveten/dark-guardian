<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c0a09">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>어둠의 수호자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* layout: full-bleed canvas battlefield, DOM HUD pinned to the four corners, modal sheets for bag/stats. single dark theme by design */
:root{
  --bg:#0c0a09; --panel:#16110e; --panel2:#201913; --line:#3d3127; --line2:#5a4634;
  --ink:#ece3d3; --mute:#9a8c79; --blood:#a3302a; --gold:#d6aa4e;
  --magic:#7d96ff; --rare:#ffe24d; --uniq:#e4b65a; --hp:#b8322b; --mp:#3b5fd1; --xp:#c9a14a;
  --f-disp:'Nanum Myeongjo','Batang',serif; --f-body:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:fixed;inset:0;background:var(--bg)}
[hidden]{display:none!important}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-touch-callout:none}
#app,#hud{touch-action:none}

/* screens */
.screen{position:absolute;inset:0;overflow:auto;touch-action:pan-y;background:radial-gradient(ellipse at 50% 18%,#2b1813 0%,#120d0b 55%,var(--bg) 100%);display:flex;flex-direction:column;align-items:center;gap:16px;box-sizing:border-box;padding-block:max(22px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-bottom));padding-inline:16px;z-index:20}
.screen h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(30px,7vw,46px);letter-spacing:.06em;margin:4px 0 0;color:#e9d9b4;text-wrap:balance;text-align:center}
.eyebrow{font-size:12px;letter-spacing:.24em;color:var(--blood);font-weight:700}
.sub{color:var(--mute);font-size:14px;margin:0;text-align:center}
.classes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:640px}
@media (max-width:520px){.classes{grid-template-columns:1fr}}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.ccard[aria-pressed="true"]{border-color:var(--gold);background:var(--panel2);box-shadow:0 0 0 1px var(--gold) inset}
.ccard .cn{font-family:var(--f-disp);font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px}
.ccard .dot{width:12px;height:12px;border-radius:50%}
.ccard .cl{font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums}
.ccard .cd{font-size:12.5px;color:var(--mute);line-height:1.5}
.modes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;max-width:640px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:12px 18px;font-size:15px;font-weight:700;min-height:46px}
.btn.primary{background:var(--blood);border-color:#c5463d;color:#fff4ea}
.btn:disabled{opacity:.45;cursor:default}
.join{display:flex;gap:8px}
.join input{width:110px;background:#0f0b09;border:1px solid var(--line2);border-radius:8px;color:var(--ink);font-size:18px;letter-spacing:.3em;text-align:center;font-family:var(--f-body);padding:0 8px;min-height:46px}
.note{font-size:12.5px;color:var(--mute);max-width:520px;text-align:center;line-height:1.6;margin:0}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.toggle input{width:18px;height:18px;accent-color:var(--gold)}
.code{font-family:var(--f-disp);font-size:56px;letter-spacing:.2em;color:var(--rare);font-weight:800;font-variant-numeric:tabular-nums}
.lobbybox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:420px;box-sizing:border-box}
.plist{display:flex;flex-direction:column;gap:6px;width:100%}
.plist div{display:flex;justify-content:space-between;background:#0f0b09;border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:14px}
.endtitle{font-family:var(--f-disp);font-size:clamp(28px,6vw,40px);font-weight:800;margin:10vh 0 0}
.endstats{display:grid;grid-template-columns:repeat(3,auto);gap:4px 22px;font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px;text-align:center}
.endstats b{display:block;color:var(--ink);font-size:20px}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
#hud button{pointer-events:auto}
.tl{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;width:min(220px,40vw)}
.meRow{display:flex;gap:8px;align-items:center}
.lv{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid var(--gold);background:#1a130d;display:grid;place-items:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.bars{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.bar{position:relative;height:12px;background:#0a0807;border:1px solid #3a2e24;border-radius:3px;overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:left;background:var(--hp)}
.bar.mp i{background:var(--mp)} .bar.xp{height:5px} .bar.xp i{background:var(--xp)}
.bar span{position:absolute;inset:0;font-size:9.5px;line-height:12px;text-align:center;font-variant-numeric:tabular-nums;color:#f6e9d8;text-shadow:0 1px 1px #000}
.ally{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--mute)}
.ally .bar{flex:1;height:8px}
.tc{position:absolute;left:50%;transform:translateX(-50%);top:max(8px,env(safe-area-inset-top));width:min(300px,38vw);display:flex;flex-direction:column;align-items:center;gap:4px}
#bVil{margin-top:2px;padding:6px 14px;min-height:34px;border-radius:17px;border:2px solid #d6aa4e;background:rgba(60,44,16,.9);color:#ffe7a8;font-weight:700;font-size:12.5px;box-shadow:0 0 14px rgba(214,170,78,.45)}
#bSkip{margin-top:2px;padding:6px 14px;min-height:34px;border-radius:17px;border:2px solid #a3302a;background:rgba(70,16,12,.9);color:#ffd6c8;font-weight:700;font-size:12.5px}
#bVil.cool{border-color:#5a4634;color:#9a8c79;box-shadow:none;background:rgba(22,17,14,.85)}
#hWave{font-family:var(--f-disp);font-weight:800;font-size:15px;letter-spacing:.06em;color:#e9d9b4;text-shadow:0 1px 3px #000;white-space:nowrap}
.bar.vil{width:100%;height:12px} .bar.vil i{background:#8a6a3a}
.tr{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;gap:6px}
.hb{position:relative;width:42px;height:42px;border-radius:8px;background:rgba(22,17,14,.85);border:1px solid var(--line2);font-size:12px;font-weight:700;display:grid;place-items:center}
.badge{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:8px;background:var(--blood);font-size:10px;line-height:16px;padding:0 3px;box-sizing:border-box;font-variant-numeric:tabular-nums}
.orbs{position:absolute;inset:0;pointer-events:none}
.orb.hp{position:absolute;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom))}
.orb.mp{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom))}
.orb{width:86px;height:86px;border-radius:50%;overflow:hidden;background:#0b0807;border:3px solid #7a6038;box-shadow:0 0 0 2px #1a120b,0 4px 16px rgba(0,0,0,.7)}
.orb i{position:absolute;inset:0;transform-origin:bottom;transition:transform .15s;background:radial-gradient(circle at 40% 30%,#ff7563,#b8180f 55%,#4f0705)}
.orb.mp i{background:radial-gradient(circle at 40% 30%,#8fb0ff,#2346c4 55%,#0b1b58)}
.orb::after{content:'';position:absolute;left:18%;top:9%;width:40%;height:22%;border-radius:50%;background:rgba(255,255,255,.2);transform:rotate(-20deg)}
.orb span{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:0 1px 3px #000,0 0 6px #000;font-variant-numeric:tabular-nums;line-height:1.15}
.orb b{font-size:14px;font-weight:700;color:#fff}
.orb small{font-size:9.5px;color:#e8dccb}
@media (max-width:480px){.orb{width:72px;height:72px}.orb b{font-size:12px}}
.br{position:absolute;right:calc(max(10px,env(safe-area-inset-right)) + 96px);bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:10px}
#skills{display:grid;grid-template-columns:repeat(3,58px);gap:8px;direction:rtl}
.sb.press{transform:scale(.92)}
.sb .cdt{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums}
.sb.cd .nm{opacity:.35}
.sb{direction:ltr;position:relative;width:58px;height:58px;border-radius:50%;border:2px solid var(--c,#888);background:rgba(18,13,10,.82);font-size:12px;font-weight:700;padding:0;overflow:hidden;touch-action:none}
.sb .cdv{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.7) calc(var(--p,0)*1turn),transparent 0)}
.sb .lvn{position:absolute;bottom:3px;left:0;right:0;font-size:9px;color:var(--mute);font-variant-numeric:tabular-nums}
.sb .nm{position:relative}
.sb.on{background:rgba(70,60,20,.85);box-shadow:0 0 12px var(--c)}
.sb.nomana{opacity:.45}
.atkcol{display:flex;flex-direction:column;align-items:center;gap:8px}
#bAtk{width:78px;height:78px;border-radius:50%;border:2px solid var(--blood);background:rgba(60,18,14,.85);font-family:var(--f-disp);font-weight:800;font-size:16px;touch-action:none}
#bPot{border:2px solid #b8322b}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--f-disp);font-weight:800;font-size:clamp(26px,6vw,44px);color:#efdcae;text-shadow:0 2px 12px #000,0 0 30px rgba(163,48,42,.6);opacity:0;transition:opacity .4s;pointer-events:none}
#banner small{display:block;font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--mute);margin-top:6px}
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(8px,env(safe-area-inset-top)) + 104px);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;width:min(420px,70vw)}
.toast{background:rgba(12,9,8,.88);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12.5px;text-align:center;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}#banner{transition:none}}

/* sheets */
.sheetwrap{position:absolute;inset:0;background:rgba(5,4,3,.72);z-index:30;display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));box-sizing:border-box}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.sheet header h2{font-family:var(--f-disp);font-weight:800;font-size:18px;margin:0;letter-spacing:.04em}
.sheet .x{background:none;border:1px solid var(--line2);border-radius:6px;width:36px;height:36px;font-size:18px}
.sbody{overflow:auto;touch-action:pan-y;padding:12px 14px;display:grid;gap:14px}
.bag{grid-template-columns:minmax(0,230px) minmax(0,1fr)}
@media (max-width:560px){.bag{grid-template-columns:1fr}}
.eq{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:start}
.slot,.cell{position:relative;aspect-ratio:1;max-width:100%;background:#0f0b09;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;padding:0}
.slot .sl{position:absolute;bottom:2px;left:0;right:0;font-size:9.5px;color:var(--mute);text-align:center}
.slot svg,.cell svg{width:58%;height:58%}
.slot.sel,.cell.sel{outline:2px solid var(--gold);outline-offset:1px}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:5px;align-content:start}
.detail{background:#0f0b09;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13px;line-height:1.6;min-height:60px}
.detail .in{font-family:var(--f-disp);font-weight:800;font-size:17px}
.detail .meta{color:var(--mute);font-size:12px}
.detail ul{margin:6px 0;padding-left:16px;color:#a9b8ff}
.detail .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.detail .acts .btn{padding:8px 14px;min-height:38px;font-size:13px}
.cmp{color:var(--mute);font-size:12px}
.up{color:#8fd47a}.dn{color:#e07060}
.stats{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
@media (max-width:600px){.stats{grid-template-columns:1fr}}
.box{background:#0f0b09;border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.box h3{margin:0 0 4px;font-size:13px;letter-spacing:.08em;color:var(--gold);font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px;font-variant-numeric:tabular-nums}
.row .k{color:var(--mute)}
.plus{width:46px;height:46px;border-radius:10px;border:2px solid var(--gold);background:#2a2014;color:var(--gold);font-weight:700;font-size:24px;line-height:1;padding:0;flex:none}
.plus:disabled{opacity:.25;border-color:var(--line2);color:var(--mute)}
.skrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid #241c16}
.skrow:first-of-type{border-top:0}
.skic{width:34px;height:34px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;font-size:11px;font-weight:700}
.skn{font-weight:700;font-size:13.5px}
.skd{font-size:12px;color:var(--mute);line-height:1.45}
.lock{opacity:.45}
.menuL{display:flex;flex-direction:column;gap:10px;padding:16px}

.namebox{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mute)}
.namebox input{width:170px;background:#0f0b09;border:1px solid var(--line2);border-radius:8px;color:var(--ink);font-size:16px;font-family:var(--f-body);padding:0 10px;min-height:44px;text-align:center}
#sheetTabs{display:flex;gap:6px;margin:0 8px;flex:1;justify-content:center}
#sheetTabs button{padding:6px 12px;min-height:36px;border:1px solid var(--line2);border-radius:6px;background:#0f0b09;font-size:13px;font-weight:700}
#sheetTabs button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:var(--panel2)}
.gold{font-size:12.5px;color:var(--gold);text-shadow:0 1px 3px #000;font-weight:700}
.qb{position:absolute;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:10px}
.qb button{width:54px;height:54px;border-radius:50%;background:rgba(18,13,10,.85);font-size:11px;font-weight:700;touch-action:none;position:relative;line-height:1.2;padding:0}
#bRev{border:2px solid #8a7440;color:#bba878}
#bRev.rdy{border-color:#ffd84a;color:#fff2b0;box-shadow:0 0 16px #ffd84a;animation:rv 1s infinite alternate}
@keyframes rv{to{box-shadow:0 0 5px #ffd84a}}
.shopitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #241c16}
.shopitem:first-of-type{border-top:0}
.price{color:var(--gold);font-weight:700}
.shopitem .btn{flex:none;white-space:nowrap;padding:10px 12px;font-size:14px}
.smsg{font-size:12.5px;color:var(--gold);min-height:18px}
</style>

<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud" hidden>
    <div class="tl">
      <div class="meRow">
        <div class="lv" id="hLv">1</div>
        <div class="bars">
          <div class="bar xp"><i id="hXp"></i></div>
        </div>
      </div>
      <div class="ally" id="hAlly" hidden><span id="hAllyN"></span><div class="bar"><i id="hAllyHp"></i></div></div>
      <div class="gold" id="hGold"></div>
    </div>
    <div class="tc">
      <div id="hWave">준비</div>
      <div class="bar vil"><i id="hVil"></i><span id="hVilT"></span></div>
      <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap"><button id="bSkip" hidden aria-label="다음 습격 바로 시작">다음 습격 ▶</button><button id="bVil" hidden aria-label="마을 결계">마을 결계</button></div>
    </div>
    <div class="tr">
      <button class="hb" id="bBag" aria-label="가방">가방</button>
      <button class="hb" id="bStat" aria-label="능력치와 스킬">능력<span class="badge" id="statBadge" hidden>0</span></button>
      <button class="hb" id="bShop" aria-label="상점">상점</button>
      <button class="hb" id="bMenu" aria-label="메뉴">메뉴</button>
    </div>
    <div class="orbs">
      <div class="orb hp"><i id="hHp"></i><span><b id="hHpT"></b><small>생명력</small></span></div>
      <div class="orb mp"><i id="hMp"></i><span><b id="hMpT"></b><small>마나</small></span></div>
    </div>
    <div class="br">
      <div id="skills"></div>
    </div>
    <div class="qb">
      <button id="bPot" aria-label="물약">물약<span class="badge" id="potN">3</span></button>
      <button id="bRev" aria-label="즉시 부활">부활<span class="badge" id="revN">0</span></button>
    </div>
    <div id="toasts"></div>
    <div id="banner"></div>
  </div>

  <section class="screen" id="sTitle">
    <div class="eyebrow">STAGE 1 · 잿빛 마을</div>
    <h1>어둠의 수호자</h1>
    <p class="sub">몰려오는 언데드에게서 마을을 지키세요. 8번의 습격 뒤에 군주가 옵니다.</p>
    <div class="classes" id="classCards"></div>
    <div class="namebox"><label for="charName">캐릭터 이름</label><input id="charName" maxlength="8" placeholder="이름 (최대 8자)" autocomplete="off"></div>
    <div class="modes"><button class="btn" id="bGear">장비 · 능력치 정비</button><button class="btn" id="bShopT">상점</button></div>
    <div class="modes">
      <button class="btn primary" id="bSolo">혼자 하기</button>
      <button class="btn" id="bHost" disabled>방 만들기</button>
      <div class="join"><input id="joinCode" inputmode="numeric" maxlength="4" placeholder="코드" aria-label="방 코드"><button class="btn" id="bJoin" disabled>참가</button></div>
    </div>
    <label class="toggle"><input type="checkbox" id="testDrop"> 드롭 테스트 모드 (매직 이상 확률 ×50)</label>
    <p class="note" id="netNote">온라인 연결 확인 중…</p>
    <p class="note">조작: 왼쪽 화면을 끌어 이동 · 기본 공격은 자동 · 아이템은 가까이 가면 자동으로 주워요 · 오른쪽 스킬 버튼은 직접 눌러 사용(쿨타임, 마나 소모)  가로 화면을 추천해요.</p>
  </section>

  <section class="screen" id="sLobby" hidden>
    <div class="eyebrow" id="lobbyEye">방 만들기</div>
    <div class="lobbybox">
      <div class="sub" id="lobbyHint">친구에게 이 코드를 알려주세요</div>
      <div class="code" id="lobbyCode">0000</div>
      <div class="plist" id="lobbyList"></div>
      <div class="modes">
        <button class="btn primary" id="bStart">시작</button>
        <button class="btn" id="bLeave">나가기</button>
      </div>
    </div>

/* ================= KILL / LOOT / XP ================= */
function onKill(x,y,xp,tier,ilvl,type){

let uiDirty=true, hudT=0;
function buildSkills(){
  const box=$('#skills'); box.innerHTML='';
  for(const s of SK[me.cls]){ if(!(me.skills[s.k]>0)||s.passive)continue;
    const b=document.createElement('button'); b.className='sb'; b.dataset.k=s.k; b.style.setProperty('--c',s.el); b.setAttribute('aria-label',s.n);
    b.innerHTML=`<span class="cdv"></span><span class="nm">${esc(s.s)}</span><span class="cdt"></span><span class="lvn"></span>`;
    bindHold(b,s.k); box.appendChild(b);}
}
function updateHud(){
  const D=me.D;
  $('#hLv').textContent=me.lvl;
  $('#hHp').style.transform=`scaleY(${clamp(me.hp/D.maxHp,0,1)})`; $('#hHpT').textContent=me.dead?`부활 ${Math.ceil(me.respawn)}`:`${Math.ceil(me.hp)}/${D.maxHp}`;
  $('#hMp').style.transform=`scaleY(${clamp(me.mp/D.maxMp,0,1)})`; $('#hMpT').textContent=`${Math.floor(me.mp)}/${D.maxMp}`;
  $('#hXp').style.transform=`scaleX(${me.lvl>=99?1:clamp(me.xp/need(me.lvl),0,1)})`;
  const ph=G.phase;
  $('#hWave').textContent= ph==='prep'?(G.wave>=8?`군주 출현까지 ${Math.max(0,Math.ceil(G.timer))}초`:`습격 ${G.wave+1} 까지 ${Math.max(0,Math.ceil(G.timer))}초`)
    : ph==='wave'?`습격 ${G.wave} / 8` : ph==='boss'?'군주 토벌' : ph==='win'?'승리':'함락';
  $('#hVil').style.transform=`scaleX(${clamp(G.vil.hp/G.vil.max,0,1)})`; $('#hVilT').textContent=`마을 ${Math.max(0,Math.ceil(G.vil.hp))} / ${G.vil.max} · ${G.vil.tier}단계`;
  const sb=$('#bSkip'), cs=G.mode==='guest'?G.canSkip:canSkip(); sb.hidden=!cs; if(cs) sb.textContent=G.wave>=8?'군주 바로 소환 ▶':G.phase==='prep'?'다음 습격 ▶':'다음 습격 겹치기 ▶';
  const bv=$('#bVil'); bv.hidden=G.vil.tier<3; if(!bv.hidden){const cd=Math.ceil(G.vmCd||0); bv.classList.toggle('cool',cd>0); bv.textContent=cd>0?`마을 결계 ${cd}초`:'마을 결계 발동';}
  const al=$('#hAlly');
  if(ally&&!ally.lobby){al.hidden=false; $('#hAllyN').textContent=`${ally.name||CLASSES[ally.cls].n} ${ally.lvl}`; $('#hAllyHp').style.transform=`scaleX(${clamp((ally.hp||0)/(ally.mh||1),0,1)})`;} else al.hidden=true;
  $('#potN').textContent=me.pot+me.potBuy; $('#revN').textContent=me.rev; $('#bRev').classList.toggle('rdy',!!me.dead&&me.rev>0); $('#hGold').textContent=`${(me.gold|0).toLocaleString()}원`;
  const pts=me.statPts+me.skillPts, bd=$('#statBadge'); bd.hidden=pts<=0; bd.textContent=pts;
  for(const b of $('#skills').children){ const k=b.dataset.k, s=SKBY[k];
    const rem=me.cds[k]||0, cd=rem/s.cd; b.querySelector('.cdv').style.setProperty('--p',s.aura?0:clamp(cd,0,1));
    b.classList.toggle('cd',!s.aura&&rem>0); b.querySelector('.cdt').textContent=(!s.aura&&rem>0)?(rem>=1?Math.ceil(rem):rem.toFixed(1)):'';
    b.classList.toggle('on',me.aura===k); b.classList.toggle('nomana',me.mp<mpCost(s,skLv(me,k)));
    b.querySelector('.lvn').textContent=skLv(me,k); }
}

/* ================= SHEETS ================= */
let sheetMode=null, selItem=null;
let shopMsg='';
function openSheet(m){ if(!G.inGame&&!G.titleSheet)return; sheetMode=m; selItem=null; shopMsg=''; $('#sheet').hidden=false; if(G.inGame&&G.mode==='solo')G.paused=true; for(const k in held)held[k]=false; joy.active=false;
  rerender(); }
function rerender(){ if(sheetMode==='bag')renderBag(); else if(sheetMode==='stat')renderStat(); else if(sheetMode==='shop')renderShop(); else renderMenu(); }
function markTabs(){ const t=$('#sheetTabs'); t.hidden=sheetMode==='menu'; t.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===sheetMode)); }
$('#sheetTabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; sheetMode=b.dataset.m; selItem=null; shopMsg=''; rerender(); });
function openTitleSheet(m){ prepMe(); G.titleSheet=true; openSheet(m); }
function closeSheet(){ const was=G.titleSheet; sheetMode=null; $('#sheet').hidden=true; G.paused=false; if(was){ G.titleSheet=false; renderClassCards(); } }
$('#sheetX').onclick=closeSheet;
$('#sheet').addEventListener('pointerdown',e=>{ if(e.target.id==='sheet')closeSheet(); });
$('#bSkip').addEventListener('pointerdown',e=>{e.preventDefault(); if(!G.inGame)return; if(G.mode==='guest'){G.sq=(G.sq||0)+1; toast('다음 습격 요청을 보냈어요');} else skipWave('');});
$('#bVil').addEventListener('pointerdown',e=>{e.preventDefault();useVillageMagic();});
$('#bShop').onclick=()=>openSheet('shop'); $('#bBag').onclick=()=>openSheet('bag'); $('#bStat').onclick=()=>openSheet('stat'); $('#bMenu').onclick=()=>openSheet('menu');
function cellHtml(it,cls,extra){
  if(!it) return `<button class="${cls}" ${extra||''}>${extra&&extra.includes('data-eq')?'':''}</button>`;
  return `<button class="${cls}${selItem&&selItem.it===it?' sel':''}" ${extra||''} style="border-color:${it.rar>=2?RARC[it.rar]:it.rar===1?'#3e4a7c':'var(--line)'};background:${it.rar===3?'#2a1d0c':it.rar===2?'#262010':it.rar===1?'#12162a':'#0f0b09'}" aria-label="${esc(it.name)}"><img src="${itemIcon(it).url}" alt="" style="width:86%;height:86%;pointer-events:none"></button>`;
}
function renderBag(){
  markTabs(); $('#sheetT').textContent=`가방 · ${me.gold}원`;
  const eqOrder=['weapon','helm','amulet','ring1','armor','ring2'];
  let h='<div style="display:flex;flex-direction:column;gap:10px;min-width:0"><div class="eq">'+eqOrder.map(k=>{const it=me.eq[k]; return `<div style="position:relative">${cellHtml(it,'slot',`data-eq="${k}" style="width:100%"`)}<div class="sl" style="position:absolute;bottom:2px;left:0;right:0;font-size:9.5px;color:var(--mute);text-align:center;pointer-events:none">${EQN[k]}</div></div>`;}).join('')+'</div>';
  h+=`<div class="detail" id="detail">${detailHtml()}</div></div>`;
  h+='<div class="inv">'+me.inv.map((it,i)=>cellHtml(it,'cell',`data-inv="${i}"`)).join('')+'</div>';
  const b=$('#sheetB'); b.className='sbody bag'; b.innerHTML=h;
  b.querySelectorAll('[data-eq]').forEach(el=>el.onclick=()=>{const k=el.dataset.eq; if(me.eq[k]){selItem={it:me.eq[k],eq:k};renderBag();}});
  b.querySelectorAll('[data-inv]').forEach(el=>el.onclick=()=>{const i=+el.dataset.inv; if(me.inv[i]){selItem={it:me.inv[i],inv:i};renderBag();}});
  const ab=b.querySelector('#aEquip'); if(ab)ab.onclick=()=>{equip(selItem.inv);};
  const asl=b.querySelector('#aSell'); if(asl)asl.onclick=()=>sellBtn(asl);
  const au=b.querySelector('#aUnequip'); if(au)au.onclick=()=>{unequip(selItem.eq);};
  const ad=b.querySelector('#aDrop'); if(ad)ad.onclick=()=>{ if(ad.dataset.confirm){ me.inv[selItem.inv]=null; selItem=null; saveChar(); renderBag(); } else { ad.dataset.confirm=1; ad.textContent='정말 버릴까요? 한 번 더 누르세요'; } };
}
function sellBtn(btn){ const it=selItem&&selItem.it; if(!it||selItem.inv===undefined)return; if(it.rar>=2&&!btn.dataset.confirm){ btn.dataset.confirm=1; btn.textContent=`${RARN[it.rar]} 아이템이에요. 한 번 더 누르면 판매`; return; } sellItem(selItem.inv); }
function sellItem(i){ const it=me.inv[i]; if(!it)return; const v=sellInfo(it).total; me.gold+=v; me.inv[i]=null; selItem=null; shopMsg=`${it.name} 판매 +${v}원`; saveChar(); uiDirty=true; rerender(); }
function itemLines(it){
  let s=`<div style="display:flex;gap:10px;align-items:center"><img src="${itemIcon(it).url}" alt="" style="width:56px;height:56px;flex:none;background:#0a0807;border:1px solid ${RARC[it.rar]};border-radius:8px"><div><div class="in" style="color:${RARC[it.rar]}">${esc(it.name)}</div><div class="meta">${RARN[it.rar]} ${SLOTN[it.slot]} · ${esc(it.base)} · 아이템 레벨 ${it.ilvl}</div></div></div>`;
  const bt=baseText(it); if(bt)s+=`<div>${bt}</div>`;
  if(it.aff.length) s+='<ul>'+it.aff.map(a=>`<li>${esc(affText(a))}${(a.cls&&a.cls!==me.cls)?' <span class="meta">(효과 없음)</span>':''}</li>`).join('')+'</ul>';
  return s;
}
function eqKeyFor(it){ if(it.slot!=='ring')return it.slot; return !me.eq.ring1?'ring1':!me.eq.ring2?'ring2':'ring1'; }
function detailHtml(){
  if(!selItem) return '<span class="meta">아이템을 누르면 정보가 나와요. 바닥의 아이템은 탭해서 주울 수 있어요.</span>';
  const it=selItem.it; let s=itemLines(it);
  if(selItem.inv!==undefined){
    const k=eqKeyFor(it), cur=me.eq[k];
    const after=derive({...me,eq:{...me.eq,[k]:it}}), now=me.D;
    const diff=(lbl,a,b)=>{const d=a-b; return d?` <span class="${d>0?'up':'dn'}">${lbl} ${d>0?'+':''}${d}</span>`:'';};
    s+=`<div class="cmp">${cur?`장착 중: ${esc(cur.name)}`:'빈 칸에 장착'} ·${diff('생명력',after.maxHp,now.maxHp)}${diff('방어력',after.def,now.def)}${diff('최대 공격력',after.wmx+after.dmg,now.wmx+now.dmg)}</div>`;
    s+=`<div class="acts"><button class="btn primary" id="aEquip">장착</button><button class="btn" id="aSell">판매 ${sellInfo(it).total}원</button><button class="btn" id="aDrop">버리기</button></div>`;
  }else s+=`<div class="acts"><button class="btn" id="aUnequip">해제</button></div>`;
  return s;
}
function equip(i){
  const it=me.inv[i]; if(!it)return; const k=eqKeyFor(it); const old=me.eq[k];
  me.eq[k]=it; me.inv[i]=old||null; const hpR=me.hp/me.D.maxHp, mpR=me.mp/me.D.maxMp;
  me.D=derive(me); me.hp=me.D.maxHp*hpR; me.mp=me.D.maxMp*mpR;
  selItem={it,eq:k}; saveChar(); renderBag(); uiDirty=true; buildSkills();
}
function unequip(k){
  const i=me.inv.indexOf(null); if(i<0){toast('가방이 가득 찼어요','#e07060');return;}
  me.inv[i]=me.eq[k]; me.eq[k]=null; me.D=derive(me); me.hp=Math.min(me.hp,me.D.maxHp); me.mp=Math.min(me.mp,me.D.maxMp);
  selItem={it:me.inv[i],inv:i}; saveChar(); renderBag(); buildSkills();
}
function renderStat(){
  markTabs(); $('#sheetT').textContent=`${CLASSES[me.cls].n} · 레벨 ${me.lvl}`;
  const D=me.D, S=[['str','힘','근접 피해 +1%'],['dex','민첩','방어력, 공격 속도'],['vit','체력','생명력 +3'],['ene','에너지','마나 +0.8, 마법 피해 +1%']];
  let h=`<div class="box"><h3>능력치 · 남은 포인트 ${me.statPts}</h3><div class="k" style="font-size:11.5px">기본 수치 <span class="up">+장비 보너스</span></div>`;
  for(const [k,n,ds] of S) h+=`<div class="row"><span><b>${n}</b> <span class="k" style="font-size:11.5px">${ds}</span></span><span style="display:flex;align-items:center;gap:10px"><span style="font-size:15px">${me.stats[k]}${D[k]>me.stats[k]?`<span class="up">+${D[k]-me.stats[k]}</span> <span class="k" style="font-size:12px">= ${D[k]}</span>`:''}</span><button class="plus" data-st="${k}" ${me.statPts>0?'':'disabled'} aria-label="${n} 올리기">+</button></span></div>`;
  h+=`<div style="height:6px"></div>`;
  const dps=Math.round((D.wmn+D.wmx)/2+D.dmg);
  const rows=[['생명력',`${Math.ceil(me.hp)} / ${D.maxHp}`],['마나',`${Math.floor(me.mp)} / ${D.maxMp}`],['무기 공격력',`${D.wmn+D.dmg}–${D.wmx+D.dmg}`],['피해 보너스',`+${D.str+D.dmgPct}%`],['방어력',D.def],['공격 속도',`+${Math.round(D.ias+D.dex*.25)}%`],['치명타',`${D.crit}%`],['이동 속도',`+${D.ms}%`],['생명력 흡수',`${D.ls}%`],['스킬 보너스',`+${D.cls} (전체)`]];
  for(const [a,b] of rows) h+=`<div class="row"><span class="k">${a}</span><span>${b}</span></div>`;
  h+='</div>';
  h+=`<div class="box"><h3>스킬 · 남은 포인트 ${me.skillPts}</h3>`;
  for(const s of SK[me.cls]){
    const b=me.skills[s.k]||0, eff=skLv(me,s.k), bonus=eff-b, can=me.skillPts>0&&me.lvl>=s.req&&b<20;
    h+=`<div class="skrow ${me.lvl<s.req?'lock':''}"><div class="skic" style="--c:${s.el};color:${s.el}">${esc(s.s)}</div><div><div class="skn">${esc(s.n)} <span class="k" style="font-weight:400;font-size:12px;color:var(--mute)">${b?`Lv ${b}${bonus?` (+${bonus})`:''}`:`레벨 ${s.req}부터`}${s.aura?' · 오라':''}${s.passive?' · 패시브':''}${s.cd>=1?` · 쿨타임 ${s.cd}초`:''}${s.mp?` · 마나 ${mpCost(s,eff||1)}${b&&b<20?` (다음 ${mpCost(s,(eff||1)+1)})`:''}`:''}</span></div><div class="skd">${esc(s.d(Math.max(1,eff||1)))}</div></div><button class="plus" data-sk="${s.k}" ${can?'':'disabled'} aria-label="${esc(s.n)} 올리기">+</button></div>`;
  }
  h+='</div>';
  const bo=$('#sheetB'); bo.className='sbody stats'; bo.innerHTML=h;
  bo.querySelectorAll('[data-st]').forEach(el=>el.onclick=()=>{ if(me.statPts<=0)return; me.statPts--; me.stats[el.dataset.st]++; const hp=me.hp,mp=me.mp; me.D=derive(me); me.hp=Math.min(hp,me.D.maxHp); me.mp=Math.min(mp,me.D.maxMp); saveChar(); renderStat(); });
  bo.querySelectorAll('[data-sk]').forEach(el=>el.onclick=()=>{ const k=el.dataset.sk, s=SKBY[k]; if(me.skillPts<=0||me.lvl<s.req)return; me.skillPts--; me.skills[k]=(me.skills[k]||0)+1; saveChar(); buildSkills(); renderStat(); });
}
const SHOP={potion:{n:'회복 물약',d:'생명력·마나 45% 회복. 습격마다 주는 무료 물약 3개와 별도로 쌓여요.',p:200},rev:{n:'즉시 부활',d:'쓰러졌을 때 6초를 기다리지 않고 마을에서 바로 부활해요.',p:500}};
function shopRow(k){ const o=SHOP[k], have=k==='potion'?me.potBuy:me.rev; return `<div class="shopitem"><div><b>${o.n}</b><div class="skd">${o.d}</div><div class="k" style="font-size:12px;color:var(--mute)">보유 ${have}개 · 최대 20개</div></div><button class="btn" data-buy="${k}"><span class="price">${o.p}원</span> 구매</button></div>`; }
function renderShop(){
  markTabs(); $('#sheetT').textContent=`상점 · 보유 ${me.gold}원`;
  const norm=me.inv.reduce((a,it)=>a+(it&&it.rar===0?1:0),0), normV=me.inv.reduce((a,it)=>a+(it&&it.rar===0?sellInfo(it).total:0),0);

  let d='<span class="meta">판매가: 일반 100 · 매직 200 · 레어 400 · 유니크 800원. 스킬 옵션과 고급 옵션(생명력 흡수·치명타·공격/이동 속도)은 추가금이 붙어요.</span>';
  if(selItem&&selItem.inv!==undefined&&me.inv[selItem.inv]){ const it=selItem.it, si=sellInfo(it); d=itemLines(it)+`<div class="cmp">기본 ${si.base}원${si.ex?` + 옵션 ${si.ex}원`:''}</div><div class="acts"><button class="btn primary" id="aSell">판매 ${si.total}원</button></div>`; }
  h+=`<div class="detail" id="detail">${d}</div>`;
  h+=`<button class="btn" id="aSellAll" ${norm?'':'disabled'}>일반 아이템 모두 판매 (${norm}개 · ${normV}원)</button></div>`;
  const b=$('#sheetB'); b.className='sbody stats'; b.innerHTML=h;
  b.querySelectorAll('[data-buy]').forEach(el=>el.onclick=()=>{ const k=el.dataset.buy, o=SHOP[k], key=k==='potion'?'potBuy':'rev';
    if(me.gold<o.p){shopMsg='금화가 부족해요';} else if(me[key]>=20){shopMsg='더 이상 가질 수 없어요 (최대 20개)';} else { me.gold-=o.p; me[key]++; shopMsg=`${o.n} 구매 -${o.p}원`; saveChar(); uiDirty=true; }
    renderShop(); });
  b.querySelectorAll('[data-inv]').forEach(el=>el.onclick=()=>{const i=+el.dataset.inv; if(me.inv[i]){selItem={it:me.inv[i],inv:i}; shopMsg=''; renderShop();}});
  const as=b.querySelector('#aSell'); if(as)as.onclick=()=>sellBtn(as);
  const aa=b.querySelector('#aSellAll'); if(aa)aa.onclick=()=>{ let g=0,n=0; me.inv.forEach((it,i)=>{ if(it&&it.rar===0){g+=sellInfo(it).total;n++;me.inv[i]=null;} }); me.gold+=g; selItem=null; shopMsg=`일반 아이템 ${n}개 판매 +${g}원`; saveChar(); uiDirty=true; renderShop(); };
}

$('#bGear').onclick=()=>openTitleSheet('bag'); $('#bShopT').onclick=()=>openTitleSheet('shop');

$('#bSolo').onclick=()=>{ G.mode='solo'; G.testDrop=$('#testDrop').checked; prepMe(); ally=null; resetWorld(); startStage(); };
$('#bHost').onclick=async()=>{

    const ex=cx+dx*k, ey=cy+dy*k, a=Math.atan2(dy,dx), pu=1+Math.sin(t*7)*.12;
    circle(ex,ey,24*pu,'rgba(160,10,10,.35)');
    chevron(ex,ey,a,18*pu,'#ff3a2a');
    ctx.font='700 11px "Noto Sans KR",sans-serif'; ctx.textAlign='center'; ctx.fillStyle='rgba(0,0,0,.8)';
    const lx=ex-Math.cos(a)*36, ly=ey-Math.sin(a)*36+4; const lb=G.phase==='prep'?`${L.n} 곧 출현`:`${L.n} 출현`;
    ctx.fillText(lb,lx+1,ly+1); ctx.fillStyle='#ffb0a0'; ctx.fillText(lb,lx,ly);
  }
}
function drawMinimap(){
  const w=Math.min(150,VW*.2), h=w*WH/WW, x=VW-w-Math.max(10,0)-6, y=58;
  ctx.fillStyle='rgba(10,8,7,.75)'; ctx.fillRect(x,y,w,h); ctx.strokeStyle='#6b5432'; ctx.lineWidth=1.5; ctx.strokeRect(x+.5,y+.5,w,h); ctx.fillStyle='#2c241c'; ctx.fillRect(x+VX*(w/WW)-2,y,4,VY*(h/WH)); ctx.fillRect(x,y+VY*(h/WH)-2,w,4);
  const sx=w/WW, sy=h/WH;
  ctx.fillStyle='#8a6a3a'; ctx.beginPath(); ctx.arc(x+VX*sx,y+VY*sy,VR*sx,0,6.283); ctx.fill();
  for(const m of G.mobs){ctx.fillStyle=m.boss?'#ff4a8a':m.elite?'#7d96ff':'#c2382e'; const r=m.boss?3:1.4; ctx.fillRect(x+m.x*sx-r,y+m.y*sy-r,r*2,r*2);}
  for(const g of ground) if(g.it.rar>=2){ctx.fillStyle=RARC[g.it.rar];ctx.fillRect(x+g.x*sx-1.5,y+g.y*sy-1.5,3,3);}
  if(ally&&!ally.lobby&&ally.x!==undefined){ctx.fillStyle=CLASSES[ally.cls].col;ctx.fillRect(x+ally.x*sx-2,y+ally.y*sy-2,4,4);}
  for(const sd of laneActive()){const L=LANE[sd]; chevron(x+(L.x+L.dx*40)*sx,y+(L.y+L.dy*40)*sy,Math.atan2(L.dy,L.dx),7,`rgba(255,58,42,${.6+.4*Math.sin(T*7)})`);}
  ctx.fillStyle='#fff'; ctx.fillRect(x+me.x*sx-2,y+me.y*sy-2,4,4);
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.strokeRect(x+camX*sx,y+camY*sy,VW/ZOOM*sx,VH/ZOOM*sy);
}
function render(t){
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#070605'; ctx.fillRect(0,0,cv.width,cv.height);
  if(!me)return;
  const vw=VW/ZOOM, vh=VH/ZOOM;
  camX=vw>=WW?(WW-vw)/2:clamp(me.x-vw/2,0,WW-vw); camY=vh>=WH?(WH-vh)/2:clamp(me.y-vh/2,0,WH-vh);
  let shx=0,shy=0; if(G.shake>0){shx=rand(-1,1)*G.shake*8;shy=rand(-1,1)*G.shake*8;}
  ctx.setTransform(DPR*ZOOM,0,0,DPR*ZOOM,(-camX*ZOOM+shx)*DPR,(-camY*ZOOM+shy)*DPR);
  drawWorld(t); drawLanesWorld(t); drawZones(t); drawBossTel(); drawItemsWorld(t);
  const actors=[...G.mobs.filter(m=>!m.dead).map(m=>({y:m.y,f:()=>drawMob(m,t)})),{y:me.y,f:()=>drawPlayer(me,true,t)}];
  if(ally&&!ally.lobby)actors.push({y:ally.y,f:()=>drawPlayer(ally,false,t)});
  actors.sort((a,b)=>a.y-b.y); for(const a of actors)a.f();
  drawProjs(); drawEfx(t);
  for(const p of parts){ if(p.glow)continue; ctx.globalAlpha=1-p.t/p.life; ctx.fillStyle=p.col; ctx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r);} ctx.globalAlpha=1;
  ctx.globalCompositeOperation='lighter';
  for(const p of parts){ if(!p.glow)continue; const a=1-p.t/p.life; ctx.globalAlpha=a; ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(.6+a*.6),0,6.283); ctx.fill(); ctx.globalAlpha=a*.25; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*2.6,0,6.283); ctx.fill(); }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  // screen space
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const px=(me.x-camX)*ZOOM, py=(me.y-camY)*ZOOM;
  const vg=ctx.createRadialGradient(px,py,Math.min(VW,VH)*.35,px,py,Math.max(VW,VH)*.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.45)'); ctx.fillStyle=vg; ctx.fillRect(0,0,VW,VH);
  drawItemsScreen(t); drawNums(); drawOffscreen(t); drawLanesEdge(t); drawBossBar(); drawMinimap();
  if(G.flash>0){ctx.fillStyle=`rgba(255,215,140,${G.flash*.35})`;ctx.fillRect(0,0,VW,VH);}
  if(me.dead){ctx.fillStyle='rgba(60,0,0,.25)';ctx.fillRect(0,0,VW,VH);}
  { const bx=joy.active?joy.ox:Math.max(180,VW*.2), by=joy.active?joy.oy:VH-78, al=joy.active?1:.45;
    circle(bx,by,58,`rgba(10,8,7,${.35*al})`); ctx.strokeStyle=`rgba(214,170,78,${.55*al})`; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(bx,by,58,0,6.283); ctx.stroke();
    const kx=bx+(joy.active?(joy.x-joy.ox):0), ky=by+(joy.active?(joy.y-joy.oy):0);
    circle(kx,ky,24,`rgba(236,227,211,${.35*al})`); ctx.strokeStyle=`rgba(255,255,255,${.4*al})`; ctx.beginPath(); ctx.arc(kx,ky,24,0,6.283); ctx.stroke(); }
}

/* ================= LOOP ================= */
let last=performance.now(), T=0;
function step(now){
  requestAnimationFrame(step);
  let dt=Math.min(.05,(now-last)/1000); last=now; T+=dt/1;
  if(R){ if(G.mode==='host')hostNet(); else if(G.mode==='guest')guestNet(); if(G.phase==='lobby'){ netT-=dt; if(netT<=0){netT=.5; netSend(); renderLobby();} } }
  if(bannerT>0){bannerT-=dt; if(bannerT<=0)$('#banner').style.opacity=0;}
  if(!me||!G.inGame){ if(me&&G.phase!=='title'&&G.phase!=='lobby')render(T); else {ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#070605';ctx.fillRect(0,0,cv.width,cv.height);} return; }
  if(!G.paused){
    if(G.mode!=='guest'){ updateWaves(dt); updateMobs(dt); }
    else { for(const m of G.mobs){const k=Math.min(1,dt*10); if(hyp(m.tx-m.x,m.ty-m.y)>2){m.fa=Math.atan2(m.ty-m.y,m.tx-m.x);} m.x+=(m.tx-m.x)*k; m.y+=(m.ty-m.y)*k; m.flash=Math.max(0,m.flash-dt); m.anim+=dt; } }
    if(ally&&!ally.lobby&&ally.tx!==undefined){const k=Math.min(1,dt*12); ally.x+=(ally.tx-ally.x)*k; ally.y+=(ally.ty-ally.y)*k; ally.swing=Math.max(0,(ally.swing||0)-dt);}
    updateMe(dt);
    // projectiles
    for(let i=projs.length-1;i>=0;i--){const p=projs[i]; p.life-=dt;
      if(p.kind==='hammer'){p.rad+=78*dt; p.a+=3.4*dt; p.x=p.cx+Math.cos(p.a)*p.rad; p.y=p.cy+Math.sin(p.a)*p.rad;}
      else {p.x+=p.vx*dt; p.y+=p.vy*dt;}
      if(p.trail&&Math.random()<.8) parts.push({x:p.x+rand(-3,3),y:p.y+rand(-3,3),vx:rand(-20,20),vy:rand(-20,20),t:0,life:rand(.2,.4),col:`rgb(${p.trail})`,r:rand(2,4),glow:1,dm:.85});
      let dead=p.life<=0||p.x<0||p.y<0||p.x>WW||p.y>WH;
      if(!dead){ for(const m of G.mobs){ if(m.dead)continue; if(hyp(m.x-p.x,m.y-p.y)<m.r+p.r){
          if(p.kind==='hammer'){ const lt=p.re.get(m.id)||-9; if(T-lt>.5){p.re.set(m.id,T); if(p.real)p.hit(m); spark(p.x,p.y,'#ffe08a',3);} continue; }
          if(p.real&&p.hit)p.hit(m); if(p.boom)p.boom(p.x,p.y); else spark(p.x,p.y,p.col,4); dead=true; break; } } }
      else if(p.boom&&p.life<=0)p.boom(p.x,p.y);
      if(dead)projs.splice(i,1);}
    for(let i=zones.length-1;i>=0;i--){const z=zones[i]; z.t+=dt; z.tick-=dt;
      if(z.tick<=0){z.tick=z.iv; if(z.real&&z.fn) for(const m of mobsIn(z.x,z.y,z.r)) z.fn(m);}
      if(z.t>=z.life)zones.splice(i,1);}
    for(let i=timers.length-1;i>=0;i--){const tm=timers[i]; tm.t-=dt; if(tm.t<=0){timers.splice(i,1); tm.fn();}}
  }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; const dm=p.dm||.9; p.vx*=dm; p.vy*=dm; if(p.t>=p.life)parts.splice(i,1);}
  for(let i=nums.length-1;i>=0;i--){nums[i].t+=dt; if(nums[i].t>.9)nums.splice(i,1);}
  for(let i=efx.length-1;i>=0;i--){efx[i].t+=dt; if(efx[i].t>=efx[i].life)efx.splice(i,1);}
  for(const g of ground)g.t+=dt;
  for(let i=etels.length-1;i>=0;i--){etels[i].t+=dt; if(etels[i].t>=etels[i].dur)etels.splice(i,1);}
  G.shake=Math.max(0,G.shake-dt*2); if(G.mode!=='guest'&&G.vmCd>0)G.vmCd=Math.max(0,G.vmCd-dt); else if(G.mode==='guest'&&G.vmCd>0)G.vmCd=Math.max(0,G.vmCd-dt); G.flash=Math.max(0,(G.flash||0)-dt*1.4);
  if(R&&G.mode!=='solo'){ netT-=dt; if(netT<=0){ netT=1/15;
      if(G.mode==='host'&&G.guestDmg>0){pushEv(['h',2,Math.round(G.guestDmg)]); G.guestDmg=0;}
      netSend(); } }
  hudT-=dt; if(hudT<=0||uiDirty){hudT=.1; uiDirty=false; updateHud();}
  render(T);
}
renderClassCards(); show('#sTitle');
requestAnimationFrame(step);
})();
</script>
