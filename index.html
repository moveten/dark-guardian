<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c0a09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="어둠의 수호자">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>어둠의 수호자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* layout: full-bleed canvas battlefield, DOM HUD pinned to the four corners, modal sheets for bag/stats. single dark theme by design */
:root{
  --bg:#0c0a09; --panel:#16110e; --panel2:#201913; --line:#3d3127; --line2:#5a4634;
  --ink:#ece3d3; --mute:#9a8c79; --blood:#a3302a; --gold:#d6aa4e;
  --magic:#7d96ff; --rare:#ffe24d; --uniq:#e4b65a; --hp:#b8322b; --mp:#3b5fd1; --xp:#c9a14a;
  --f-disp:'Nanum Myeongjo','Batang',serif; --f-body:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:fixed;left:0;right:0;top:0;bottom:0;background:var(--bg)}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:6px;padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:#120e0b;border-top:1px solid var(--line2);box-sizing:border-box;touch-action:manipulation}
#dock[hidden]{display:none}
#dock .hb{flex:1;width:auto;min-width:0;height:50px;flex-direction:column;gap:1px;font-size:12px;border-radius:10px;pointer-events:auto}
#dock .hb .lb{font-size:12px;font-weight:800;color:#e8dcc4}
#dock .badge{top:-6px;right:8px;min-width:20px;height:20px;line-height:20px;font-size:12px;border-radius:10px}
[hidden]{display:none!important}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-touch-callout:none}
#app,#hud{touch-action:none}

/* screens */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;touch-action:pan-y;background:radial-gradient(ellipse at 50% 18%,#2b1813 0%,#120d0b 55%,var(--bg) 100%);display:flex;flex-direction:column;align-items:center;gap:16px;box-sizing:border-box;padding-block:max(22px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-bottom));padding-inline:16px;z-index:20}
.screen h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(30px,7vw,46px);letter-spacing:.06em;margin:4px 0 0;color:#e9d9b4;text-wrap:balance;text-align:center}
.ver{font-size:11px;color:var(--mute);letter-spacing:.08em;margin:-2px 0 4px;opacity:.8}
.eyebrow{font-size:12px;letter-spacing:.24em;color:var(--blood);font-weight:700}
.sub{color:var(--mute);font-size:14px;margin:0;text-align:center}
.classes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:640px}
@media (max-width:520px){.classes{grid-template-columns:1fr}}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.ccard[aria-pressed="true"]{border-color:var(--gold);background:var(--panel2);box-shadow:0 0 0 1px var(--gold) inset}
.ccard .cn{font-family:var(--f-disp);font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px}
.ccard .dot{width:12px;height:12px;border-radius:50%}
.ccard .cl{font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums}
.ccard .cd{font-size:12.5px;color:var(--mute);line-height:1.5}
.rktabs{display:flex;gap:8px;margin:0 0 10px}.rktabs button{flex:1;min-height:42px;border-radius:8px;border:1px solid var(--line);background:#14100d;color:#cbbfae;font:700 14px 'Noto Sans KR',sans-serif}.rktabs button[aria-pressed=true]{background:#3a2a14;border-color:var(--gold);color:#ffe0a0}
.rklist{max-height:52vh;overflow-y:auto;margin:0 0 10px;-webkit-overflow-scrolling:touch}.rkrow{display:flex;align-items:center;gap:8px;padding:7px 8px;border:0;border-bottom:1px solid #2a211a;font-size:14px;width:100%;min-height:48px;background:transparent;color:inherit;text-align:left;font-family:inherit}.rkc{color:#8d806d;font-size:20px}
.rkg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px;margin:2px 0}.rkgc{background:none;border:0;padding:0;color:inherit;font-family:inherit;text-align:center}.rkgc small{display:block;font-size:11px;color:#a89a86;margin-top:2px}.rkgi{position:relative;aspect-ratio:1;border:2px solid #3a2f26;border-radius:8px;display:grid;place-items:center;overflow:hidden}.rkgc.empty .rkgi{background:#0f0b09;opacity:.5}.rkgi img{width:84%;height:84%;pointer-events:none;position:relative;z-index:1}.rkgi .en{position:absolute;right:3px;top:1px;font-size:11px;font-style:normal;font-weight:800;color:#ffd84a;text-shadow:0 0 3px #000,0 0 3px #000;z-index:2}
.rkpb{max-height:62vh;overflow-y:auto;margin:0 0 10px;-webkit-overflow-scrolling:touch}.rkit{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #2a211a}.rkit img{width:46px;height:46px;flex:none;background:#0f0b09;border:2px solid;border-radius:6px}.rkib{min-width:0;font-size:13.5px}.rkib ul{margin:3px 0 0;padding-left:16px;font-size:12.5px;color:#cbbfae}.rkit.empty{opacity:.5;align-items:center}.rkis{width:46px;text-align:center;font-size:12px}.rkpb h4{margin:12px 0 6px}.rkst{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}.rkst div{display:flex;justify-content:space-between;font-size:13px;border-bottom:1px solid #241c16;padding:3px 0}.rkst span{color:#a89a86}
.rktabs button{font-size:13px!important;padding:0 2px}.rkrow.own{background:rgba(255,200,80,.13);border-radius:6px}.rkrow.own b{color:#ffd870}.rkn{width:26px;text-align:center;font-weight:800;color:#a89a86}.rkrow.top .rkn{font-size:18px}.rke{font-size:20px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:none}.rke img,.rkh img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}.rkh{display:inline-block;width:28px;height:28px;vertical-align:-7px}.rkm{flex:1;display:flex;flex-direction:column;line-height:1.2;min-width:0}.rkm small{color:#9a8d7a;font-size:11.5px}.rkv{font-weight:800;color:#e8d6b4;white-space:nowrap}
.modes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;max-width:640px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:12px 18px;font-size:15px;font-weight:700;min-height:46px}
.btn.primary{background:var(--blood);border-color:#c5463d;color:#fff4ea}
.btn:disabled{opacity:.45;cursor:default}
.join{display:flex;gap:8px}
.join input{width:110px;background:#0f0b09;border:1px solid var(--line2);border-radius:8px;color:var(--ink);font-size:18px;letter-spacing:.3em;text-align:center;font-family:var(--f-body);padding:0 8px;min-height:46px}
.note{font-size:12.5px;color:var(--mute);max-width:520px;text-align:center;line-height:1.6;margin:0}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.toggle input{width:18px;height:18px;accent-color:var(--gold)}
.code{font-family:var(--f-disp);font-size:56px;letter-spacing:.2em;color:var(--rare);font-weight:800;font-variant-numeric:tabular-nums}
.lobbybox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:420px;box-sizing:border-box}
.plist{display:flex;flex-direction:column;gap:6px;width:100%}
.plist div{display:flex;justify-content:space-between;background:#0f0b09;border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:14px}
.endtitle{font-family:var(--f-disp);font-size:clamp(28px,6vw,40px);font-weight:800;margin:10vh 0 0}
.endstats{display:grid;grid-template-columns:repeat(3,auto);gap:4px 22px;font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px;text-align:center}
.endstats b{display:block;color:var(--ink);font-size:20px}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
#hud button{pointer-events:auto}
.tl{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;width:min(220px,40vw)}
.meRow{display:flex;gap:8px;align-items:center}
.lv{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid var(--gold);background:#1a130d;display:grid;place-items:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.bars{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.bar{position:relative;height:12px;background:#0a0807;border:1px solid #3a2e24;border-radius:3px;overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:left;background:var(--hp)}
.bar.mp i{background:var(--mp)} .bar.xp{height:16px;border:2px solid #d9b45a;border-radius:5px;box-shadow:0 0 0 1px #000,0 1px 4px rgba(0,0,0,.6)} .bar.xp i{background:var(--xp)} .bar.xp span{font-size:10.5px;font-weight:800;line-height:12px;letter-spacing:.02em;text-shadow:0 0 3px #000,0 1px 1px #000}
.bar span{position:absolute;inset:0;font-size:9.5px;line-height:12px;text-align:center;font-variant-numeric:tabular-nums;color:#f6e9d8;text-shadow:0 1px 1px #000}
.ally{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--mute)}
.ally .bar{flex:1;height:8px}
.tc{position:absolute;left:50%;transform:translateX(-50%);top:max(8px,env(safe-area-inset-top));width:min(300px,38vw);display:flex;flex-direction:column;align-items:center;gap:4px}
#bVil{margin-top:2px;padding:6px 14px;min-height:34px;border-radius:17px;border:2px solid #d6aa4e;background:rgba(60,44,16,.9);color:#ffe7a8;font-weight:700;font-size:12.5px;box-shadow:0 0 14px rgba(214,170,78,.45)}
#bSkip{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;z-index:20;padding:11px 31px;min-height:64px;font-size:21px!important;border-radius:32px;border:2px solid #a3302a;background:rgba(70,16,12,.9);color:#ffd6c8;font-weight:700;font-size:12.5px}
#bVil.cool{border-color:#5a4634;color:#9a8c79;box-shadow:none;background:rgba(22,17,14,.85)}
#hWave{font-family:var(--f-disp);font-weight:800;font-size:15px;letter-spacing:.06em;color:#e9d9b4;text-shadow:0 1px 3px #000;white-space:nowrap}
.bar.vil{width:100%;height:12px} .bar.vil i{background:#8a6a3a}
.tr{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;gap:6px}
.hb{position:relative;width:42px;height:42px;border-radius:8px;background:rgba(22,17,14,.85);border:1px solid var(--line2);font-size:21px;font-weight:700;display:grid;place-items:center}
.badge{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:8px;background:var(--blood);font-size:10px;line-height:16px;padding:0 3px;box-sizing:border-box;font-variant-numeric:tabular-nums}
.orbs{position:absolute;inset:0;pointer-events:none}
.orb.hp{position:absolute;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom))}
.orb.mp{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom))}
.orb{width:86px;height:86px;border-radius:50%;overflow:hidden;background:#0b0807;border:3px solid #7a6038;box-shadow:0 0 0 2px #1a120b,0 4px 16px rgba(0,0,0,.7)}
.orb i{position:absolute;inset:0;transform-origin:bottom;transition:transform .15s;background:radial-gradient(circle at 40% 30%,#ff7563,#b8180f 55%,#4f0705)}
.orb.mp i{background:radial-gradient(circle at 40% 30%,#8fb0ff,#2346c4 55%,#0b1b58)}
.orb::after{content:'';position:absolute;left:18%;top:9%;width:40%;height:22%;border-radius:50%;background:rgba(255,255,255,.2);transform:rotate(-20deg)}
.orb span{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:0 1px 3px #000,0 0 6px #000;font-variant-numeric:tabular-nums;line-height:1.15}
.orb b{font-size:14px;font-weight:700;color:#fff}
.orb small{font-size:9.5px;color:#e8dccb}
@media (max-width:480px){.orb{width:72px;height:72px}.orb b{font-size:12px}}
.br{position:absolute;right:calc(max(10px,env(safe-area-inset-right)) + 96px);bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:10px}
#skills{display:grid;grid-template-columns:repeat(3,58px);gap:8px;direction:rtl}
.sb.press{transform:scale(.92)}
.sb .cdt{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums}
.sb.cd .nm{opacity:.35}
.sb{direction:ltr;position:relative;width:58px;height:58px;border-radius:50%;border:2px solid var(--c,#888);background:rgba(18,13,10,.82);font-size:12px;font-weight:700;padding:0;overflow:hidden;touch-action:none}
.sb .cdv{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.7) calc(var(--p,0)*1turn),transparent 0)}
.sb .lvn{position:absolute;bottom:3px;left:0;right:0;font-size:9px;color:var(--mute);font-variant-numeric:tabular-nums}
.sb .nm{position:relative;font-size:26px;line-height:1}
.sb.on{background:rgba(70,60,20,.85);box-shadow:0 0 25px var(--c)}
.sb.nomana{opacity:.45}
.sb.nofm{opacity:.4;filter:grayscale(.8)}
/* AUTO 버튼 (0 끔 · 1 이동+일반공격 · 2 +스킬 자동) */
#bAuto{position:relative;flex:none;align-self:flex-end;width:45px;height:45px;border-radius:50%;padding:3px;border:0;box-sizing:border-box;pointer-events:auto;touch-action:none;font-family:inherit;transition:transform .1s}
#bAuto:active{transform:scale(.92)}
#bAuto .in{width:100%;height:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;line-height:1;pointer-events:none}
#bAuto b{font-size:11.5px;letter-spacing:.01em}#bAuto small{font-size:8.5px;font-weight:800;margin-top:2px}
#bAuto.s0{background:#6b604f}#bAuto.s0 .in{background:radial-gradient(circle at 35% 28%,#4a4034,#1a1510 75%);color:#b9ac96}#bAuto.s0 small{color:#8c806b}
#bAuto.s1{background:conic-gradient(#7be08f 0 180deg,#2c5a3a 180deg 360deg);box-shadow:0 0 12px rgba(111,208,138,.5)}#bAuto.s1 .in{background:radial-gradient(circle at 35% 28%,#3a8450,#143a26 75%);color:#eaffee}#bAuto.s1 small{color:#a9f2bb}
#bAuto.s2{background:conic-gradient(#ffd24a,#ff9a2e,#ffd24a);animation:autoGlow 1.6s ease-in-out infinite}#bAuto.s2 .in{background:radial-gradient(circle at 35% 28%,#a8641c,#47240a 75%);color:#fff3d2}#bAuto.s2 small{color:#ffe08a}
@keyframes autoGlow{0%,100%{box-shadow:0 0 10px rgba(255,190,70,.55)}50%{box-shadow:0 0 20px rgba(255,190,70,.95)}}
/* 1.3배속 버튼: AUTO 바로 왼쪽, 같은 크기의 둥근 버튼 */
.ab{display:flex;align-items:flex-end;gap:8px;align-self:flex-end}
#bSpd{position:relative;flex:none;align-self:flex-end;width:45px;height:45px;border-radius:50%;padding:3px;border:0;box-sizing:border-box;pointer-events:auto;touch-action:none;font-family:inherit;transition:transform .1s}
#bSpd:active{transform:scale(.92)}
#bSpd .in{width:100%;height:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;line-height:1;pointer-events:none}
#bSpd b{font-size:15px}#bSpd small{font-size:8.5px;font-weight:800;margin-top:2px}
#bSpd.s0{background:#6b604f}#bSpd.s0 .in{background:radial-gradient(circle at 35% 28%,#4a4034,#1a1510 75%);color:#b9ac96}#bSpd.s0 small{color:#8c806b}
#bSpd.s1{background:conic-gradient(#ff9a5a,#ff5a3a,#ff9a5a);animation:spdGlow 1.6s ease-in-out infinite}#bSpd.s1 .in{background:radial-gradient(circle at 35% 28%,#c0502a,#4a1608 75%);color:#fff0e0}#bSpd.s1 small{color:#ffd0a8}
#bSpd.dis{opacity:.75}#bSpd.lk{opacity:.7}#bSpd.lk b{font-size:13px}#bSpd.lk small{color:#b9ac96}   /* 협동 참가자: 방장이 정한 속도를 따라가요 */
@keyframes spdGlow{0%,100%{box-shadow:0 0 10px rgba(255,120,70,.55)}50%{box-shadow:0 0 20px rgba(255,120,70,.95)}}
.br{flex-direction:column;align-items:flex-end;gap:8px}   /* 세로: AUTO는 스킬 묶음 바로 위, 오른쪽 정렬 */
#hCastle{display:flex;align-items:center;gap:5px;width:100%;font-size:11.5px;color:#e9d9b4;text-shadow:0 1px 2px #000}
#hCastle .bar{flex:1;height:9px}
#hCastle .bar i{background:linear-gradient(90deg,#c0894a,#e8c070);transition:transform .15s}
#hCastle.low .bar i{background:#e0503a}
#hCastle b{font-weight:800;min-width:34px;text-align:right;font-size:11.5px}
#hCastle .bar::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(255,255,255,.55) calc(10% - 1px) calc(10% + 1px),transparent calc(10% + 1px) 20%)}   /* 성 파괴 단계(30·50·70·90%) 눈금 */
#hCastle.atk .bar i{background:linear-gradient(90deg,#d23a2a,#ff7a5a)}
/* 성 공격 경고 띠 + 파괴 단계 메시지 */
#casAl{position:absolute;left:0;right:0;top:100px;height:30px;display:none;align-items:center;justify-content:center;gap:8px;pointer-events:none;z-index:6;background:linear-gradient(90deg,rgba(30,0,0,0),rgba(34,2,2,.9) 16%,rgba(34,2,2,.9) 84%,rgba(30,0,0,0));border-top:1px solid rgba(255,80,80,.7);border-bottom:1px solid rgba(255,80,80,.7);font:900 15px var(--f-body);color:#ff4040;text-shadow:0 0 8px rgba(255,30,30,.7),0 0 2px #000,0 1px 0 #000;letter-spacing:1px;white-space:nowrap}
#casAl.on{display:flex;animation:casAl 2.4s both}
@keyframes casAl{0%{opacity:0}8%{opacity:1}22%{opacity:.5}36%{opacity:1}50%{opacity:.5}64%{opacity:1}85%{opacity:1}100%{opacity:0}}
#casMs{position:absolute;left:0;right:0;top:36%;text-align:center;pointer-events:none;z-index:6;display:none;font-family:var(--f-disp);font-weight:800;font-size:clamp(28px,8.6vw,38px);color:#ff5a4a;text-shadow:0 0 14px rgba(255,40,30,.8),0 0 2px #000,0 3px 0 #4a0a08;letter-spacing:2px}
#casMs small{display:block;font:700 13px var(--f-body);color:#ffd0c8;letter-spacing:0;margin-top:2px;text-shadow:0 1px 3px #000}
#casMs.on{display:block;animation:casMs 1.8s cubic-bezier(.2,.8,.2,1) both}
@keyframes casMs{0%{opacity:0;transform:scale(1.5)}12%{opacity:1;transform:scale(1)}78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.96)}}
#autoT{font-weight:800;font-size:11.5px;padding:3px 11px;border-radius:999px;white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px #000;opacity:0;transition:opacity .25s}
#autoT.show{opacity:1}
#autoT.s0{border:2px solid #7d705a;background:rgba(40,34,26,.9);color:#cfc3ad}
#autoT.s1{border:2px solid #6fd08a;background:rgba(18,50,32,.9);color:#c9ffd6}
#autoT.s2{border:2px solid #ffc04a;background:rgba(70,38,10,.9);color:#ffe7b0}
.atkcol{display:flex;flex-direction:column;align-items:center;gap:8px}

/* 생산: 메인 건물은 1시간마다 조각 1개(Lv.1 최대 24개, 레벨마다 +6 → Lv.5 48개) · 풍차는 60분(레벨당 -5분)마다 물약 1개(최대 20개). 가득 차면 멈추고, 비우면 그때부터 다시 만듦 */
function townProd(k){ const D=TOWN_B[k], lv=getTown()[k].lv|0; if(D.main)return {iv:TOWN_HOUR,cap:townMainCap(lv)}; if(D.pot)return {iv:Infinity,cap:TOWN_POT_CAP}; return null; }   /* 풍차는 더 이상 물약을 만들지 않아요(iv 무한). 예전에 쌓인 물약만 받을 수 있어요 */
/* 건물 업그레이드 시간: Lv.1(건설)은 즉시, Lv.2는 30분부터 레벨마다 2배 (Lv.3 1시간 · Lv.4 2시간 · Lv.5 4시간 · Lv.6 8시간 …). 비용은 시작할 때 내고, 올리는 동안에도 지금 레벨 효과는 그대로예요. 그림자 연구소는 연구마다 따로 시간이 걸려요 */
const TOWN_UPM=n=>n<=1?0:30*Math.pow(2,n-2);
function townUpTick(){ const T=getTown(), now=Date.now(), done=[]; for(const k in TOWN_B){ const B=T[k], D=TOWN_B[k]; if(D.lab||!(B.u>0)||now<B.u)continue; B.lv=Math.min(D.main?TOWN_MAIN_MAXLV:TOWN_MAXLV,(B.lv|0)+1); B.u=0; done.push(k); }
  if(done.length){ saveTown(); if(done.includes('mill')&&me&&me.stats){ try{ me.D=derive(me); }catch(e){} } } return done; }
function townStatBonus(){ townUpTick(); return (getTown().mill.lv|0)*TOWN_STAT; }   /* 각성 풍차: 레벨당 모든 캐릭터 올스탯 +5 */
function townTick(k,now){ const B=getTown()[k], P=townProd(k); if(!P||(B.lv|0)<1)return false; now=now||Date.now();
  if((B.n|0)>=P.cap){ if(B.n>P.cap){ B.n=P.cap; return true; } return false; }
  if(!(B.t>0)||B.t>now){ B.t=now; return true; }   /* 시계가 뒤로 가도 생산이 망가지지 않게 */
  const c=Math.floor((now-B.t)/P.iv); if(c<=0)return false;
  B.n=Math.min(P.cap,(B.n|0)+c); B.t+=c*P.iv; return true; }
function townFull(){ try{ const T=getTown(), now=Date.now(); for(const k in TOWN_B){ if(!TOWN_B[k].main)continue; const B=T[k]; if((B.lv|0)<1)continue; const P=townProd(k); if(!P)continue; let n=B.n|0; if(n<P.cap&&B.t>0&&B.t<=now)n+=Math.floor((now-B.t)/P.iv); if(n>=P.cap)return true; } }catch(e){} return false; }   /* 메인 건물 조각이 가득 찬 곳이 있으면 마을 버튼에 NEW */
const townGold=k=>!!TOWN_B[k].gold&&((getTown()[k].lv|0)<TOWN_GLV);   /* 각성 풍차: Lv.1~5까지는 골드(건설 50,000G · 올릴 때 3만G부터 +1만G씩), Lv.6으로 올릴 때부터는 ✦ 각성 그림자 조각 */
const townCost=k=>{ const lv=getTown()[k].lv|0; if(townGold(k))return lv<1?TOWN_GBUILD:20000+10000*lv; return lv<1?TOWN_BUILD:TOWN_B[k].gold?100+50*(lv-TOWN_GLV):100+50*lv; };
/* 건설/업그레이드: 공유보관함 조각으로만 결제. 'ok' 성공 · 'lack' 조각 부족 · 'max' 더 못 올림 */
function townUp(k){ townUpTick(); const B=getTown()[k], D=TOWN_B[k], lv=B.lv|0; if(lv>=(D.main?TOWN_MAIN_MAXLV:TOWN_MAXLV))return 'max'; if(B.u>0)return 'busy';

  if(townGold(k)){ if((S.gold|0)<cost)return 'lack'; S.gold-=cost; saveStore(); } else { if(shardCount(S,D.mat)<cost||!shardTake(S,cost,D.mat))return 'lack'; saveStore(); }
  const um=TOWN_UPM(lv+1);
  if(um>0){ B.u=Date.now()+um*60000; saveTown(); return 'ok'; }   /* 시간이 걸리는 업그레이드: 끝나면 townUpTick이 레벨을 올려요 */
  B.lv=lv+1; if(lv<1&&townProd(k)&&!D.stat){ B.t=Date.now(); B.n=0; } saveTown();
  if(D.stat&&me&&me.stats){ try{ me.D=derive(me); }catch(e){} }
  return 'ok'; }

function townSend(k,cid){ townTick(k); const B=getTown()[k], D=TOWN_B[k], P=townProd(k), n=B.n|0; if(n<1||!P)return 0;
  const p=(me&&me.id===cid)?me:loadChar(cid); if(!p)return 0;
  p.mail.push({id:'townmail',d:Date.now(),r:0,at:[D.pot?{k:'pot',n}:{k:'shard',mat:D.mat,n}]});
  if(p===me)saveChar(); else mailSave(p);
  if(n>=P.cap)B.t=Date.now(); B.n=0; saveTown(); return n; }
/* 만든 조각을 공유보관함으로 바로 옮김: 보관함에 자리가 모자라면 들어간 만큼만 옮기고 나머지는 건물에 남겨요 */
function townToStore(k){ townTick(k); const B=getTown()[k], D=TOWN_B[k], P=townProd(k), n=B.n|0; if(n<1||!P||D.pot)return {put:0,left:0};
  const S=getStore(), put=shardAdd(S,n,D.mat); S[D.mat]=0; if(put<=0)return {put:0,left:n};

      sc.pt=[]; for(let i=0;i<72;i++){ sc.pt.push({img:img('glow'),x:R()*W,y:R()*H,sp:R(),f:.4+R()*1.1,p:R()*6.28,tw:.7+R()*1.6,sz:.05+R()*.12}); }
      sc.nd=nodes.filter(n=>n.i!==undefined).map(n=>({n,g:img('glow').setPosition(n.x,n.y),r1:n.st==='next'?img('ring').setPosition(n.x,n.y):null,r2:n.st==='next'?img('ring').setPosition(n.x,n.y):null}));
      for(const o of sc.nd){ const n=o.n; o.g.setTint(n.st==='next'?0xfff0b8:n.dg?0xb98aff:n.st==='clear'?0xe0b64e:0x6a7a90); if(o.r1){ o.r1.setTint(n.dg?0xc9a0ff:0xffd36a); o.r2.setTint(n.dg?0xc9a0ff:0xffd36a); } }
      sc.end=0; for(const n of nodes){ if(n.st==='next'||n.st==='clear'){ const k=nearest(n.x,n.y); if(k>sc.end)sc.end=k; } }
      sc.dots=[]; if(pts.length&&sc.end>3){ const nd=Math.min(14,Math.max(3,Math.round(sc.end/12))); for(let k=0;k<nd;k++)sc.dots.push({img:img('glow').setTint(0xffe2a0),s:k*sc.end/nd}); }
    }
    update(time,dt){
      try{
        const W=this.scale.width, H=this.scale.height; if(!W||!H)return;
        const d=Math.min(dt,50)/1000; this.t+=d; const t=this.t;
        const fs=Math.max(W,600)/1024, TW=1024*fs;
        for(const f of this.fogs){ f.off=((f.off+f.v*d)%TW+TW)%TW; f.a.setScale(fs).setPosition(f.off,f.y); f.b.setScale(fs).setPosition(f.off-TW,f.y); }
        for(const q of this.pt){ const z=zoneAt(q.y), pr=ZP[z]; q.y+=pr.vy*(.6+q.sp)*d; if(q.y<-20){ q.y=H+20; q.x=Math.random()*W; } else if(q.y>H+20){ q.y=-20; q.x=Math.random()*W; }
          const c=ZC[z]; q.img.setPosition(q.x+Math.sin(t*q.f+q.p)*pr.sw*(.5+q.sp*.5),q.y).setScale(q.sz).setTint((c[0]<<16)|(c[1]<<8)|c[2]).setAlpha(Math.max(0,.15+.85*Math.sin(t*q.tw+q.p))*.8); }
        for(const o of this.nd){ const n=o.n, p=Math.sin(t*2.2+n.x);
          if(n.st==='next'){ o.g.setScale(1.7+.25*p).setAlpha(.55+.15*p); for(const [r,ph] of [[o.r1,0],[o.r2,.5]]){ const u=((t*.55+ph)%1); r.setScale(.35+1.1*u).setAlpha(.8*(1-u)); } }
          else if(n.st==='clear')o.g.setScale(1.1+.1*p).setAlpha(.26+.06*p);
          else o.g.setScale(.9).setAlpha(.07); }
        for(const o of this.dots){ o.s=(o.s+16*d)%this.end; const k=Math.min(pts.length-1,o.s|0); o.img.setPosition(pts[k][0],pts[k][1]).setScale(.14+.05*Math.sin(t*5+o.s)).setAlpha(.85*Math.min(1,o.s/12,(this.end-o.s)/12)); }
      }catch(err){ destroy(); }
    }
  }
  try{
    game=new P.Game({type:P.AUTO,parent:my,width:my.clientWidth||390,height:my.clientHeight||1800,transparent:true,banner:false,
      scale:{mode:P.Scale.RESIZE},scene:[Map],render:{antialias:true},fps:{target:60,smoothStep:true},audio:{noAudio:true},input:{keyboard:false,mouse:false,touch:false,gamepad:false}});
    if(window.ResizeObserver){ ro=new ResizeObserver(()=>{ try{ if(game)game.scale.refresh(); }catch(e){} }); ro.observe(my); }
  }catch(err){ destroy(); }
}
try{ const el=$('mapOv'); if(el)new MutationObserver(sync).observe(el,{attributes:true,attributeFilter:['hidden']}); }catch(e){}
})();
</script>
