<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c0a09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="어둠의 수호자">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>어둠의 수호자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* layout: full-bleed canvas battlefield, DOM HUD pinned to the four corners, modal sheets for bag/stats. single dark theme by design */
:root{
  --bg:#0c0a09; --panel:#16110e; --panel2:#201913; --line:#3d3127; --line2:#5a4634;
  --ink:#ece3d3; --mute:#9a8c79; --blood:#a3302a; --gold:#d6aa4e;
  --magic:#7d96ff; --rare:#ffe24d; --uniq:#e4b65a; --hp:#b8322b; --mp:#3b5fd1; --xp:#c9a14a;
  --f-disp:'Nanum Myeongjo','Batang',serif; --f-body:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:fixed;left:0;right:0;top:0;bottom:0;background:var(--bg)}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:6px;padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:#120e0b;border-top:1px solid var(--line2);box-sizing:border-box;touch-action:manipulation}
#dock[hidden]{display:none}
#dock .hb{flex:1;width:auto;min-width:0;height:50px;flex-direction:column;gap:1px;font-size:12px;border-radius:10px;pointer-events:auto}
#dock .hb .lb{font-size:12px;font-weight:800;color:#e8dcc4}
#dock .badge{top:-6px;right:8px;min-width:20px;height:20px;line-height:20px;font-size:12px;border-radius:10px}
[hidden]{display:none!important}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-touch-callout:none}
#app,#hud{touch-action:none}

/* screens */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;touch-action:pan-y;background:radial-gradient(ellipse at 50% 18%,#2b1813 0%,#120d0b 55%,var(--bg) 100%);display:flex;flex-direction:column;align-items:center;gap:16px;box-sizing:border-box;padding-block:max(22px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-bottom));padding-inline:16px;z-index:20}
.screen h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(30px,7vw,46px);letter-spacing:.06em;margin:4px 0 0;color:#e9d9b4;text-wrap:balance;text-align:center}
.ver{font-size:11px;color:var(--mute);letter-spacing:.08em;margin:-2px 0 4px;opacity:.8}
.eyebrow{font-size:12px;letter-spacing:.24em;color:var(--blood);font-weight:700}
.sub{color:var(--mute);font-size:14px;margin:0;text-align:center}
.classes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:640px}
@media (max-width:520px){.classes{grid-template-columns:1fr}}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.ccard[aria-pressed="true"]{border-color:var(--gold);background:var(--panel2);box-shadow:0 0 0 1px var(--gold) inset}
.ccard .cn{font-family:var(--f-disp);font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px}
.ccard .dot{width:12px;height:12px;border-radius:50%}
.ccard .cl{font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums}
.ccard .cd{font-size:12.5px;color:var(--mute);line-height:1.5}
.rktabs{display:flex;gap:8px;margin:0 0 10px}.rktabs button{flex:1;min-height:42px;border-radius:8px;border:1px solid var(--line);background:#14100d;color:#cbbfae;font:700 14px 'Noto Sans KR',sans-serif}.rktabs button[aria-pressed=true]{background:#3a2a14;border-color:var(--gold);color:#ffe0a0}
.rklist{max-height:52vh;overflow-y:auto;margin:0 0 10px;-webkit-overflow-scrolling:touch}.rkrow{display:flex;align-items:center;gap:8px;padding:7px 8px;border:0;border-bottom:1px solid #2a211a;font-size:14px;width:100%;min-height:48px;background:transparent;color:inherit;text-align:left;font-family:inherit}.rkc{color:#8d806d;font-size:20px}
.rkg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px;margin:2px 0}.rkgc{background:none;border:0;padding:0;color:inherit;font-family:inherit;text-align:center}.rkgc small{display:block;font-size:11px;color:#a89a86;margin-top:2px}.rkgi{position:relative;aspect-ratio:1;border:2px solid #3a2f26;border-radius:8px;display:grid;place-items:center;overflow:hidden}.rkgc.empty .rkgi{background:#0f0b09;opacity:.5}.rkgi img{width:84%;height:84%;pointer-events:none;position:relative;z-index:1}.rkgi .en{position:absolute;right:3px;top:1px;font-size:11px;font-style:normal;font-weight:800;color:#ffd84a;text-shadow:0 0 3px #000,0 0 3px #000;z-index:2}
.rkpb{max-height:62vh;overflow-y:auto;margin:0 0 10px;-webkit-overflow-scrolling:touch}.rkit{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #2a211a}.rkit img{width:46px;height:46px;flex:none;background:#0f0b09;border:2px solid;border-radius:6px}.rkib{min-width:0;font-size:13.5px}.rkib ul{margin:3px 0 0;padding-left:16px;font-size:12.5px;color:#cbbfae}.rkit.empty{opacity:.5;align-items:center}.rkis{width:46px;text-align:center;font-size:12px}.rkpb h4{margin:12px 0 6px}.rkst{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}.rkst div{display:flex;justify-content:space-between;font-size:13px;border-bottom:1px solid #241c16;padding:3px 0}.rkst span{color:#a89a86}
.rktabs button{font-size:13px!important;padding:0 2px}.rkrow.own{background:rgba(255,200,80,.13);border-radius:6px}.rkrow.own b{color:#ffd870}.rkn{width:26px;text-align:center;font-weight:800;color:#a89a86}.rkrow.top .rkn{font-size:18px}.rke{font-size:20px}.rkm{flex:1;display:flex;flex-direction:column;line-height:1.2;min-width:0}.rkm small{color:#9a8d7a;font-size:11.5px}.rkv{font-weight:800;color:#e8d6b4;white-space:nowrap}
.modes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;max-width:640px}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:12px 18px;font-size:15px;font-weight:700;min-height:46px}
.btn.primary{background:var(--blood);border-color:#c5463d;color:#fff4ea}
.btn:disabled{opacity:.45;cursor:default}
.join{display:flex;gap:8px}
.join input{width:110px;background:#0f0b09;border:1px solid var(--line2);border-radius:8px;color:var(--ink);font-size:18px;letter-spacing:.3em;text-align:center;font-family:var(--f-body);padding:0 8px;min-height:46px}
.note{font-size:12.5px;color:var(--mute);max-width:520px;text-align:center;line-height:1.6;margin:0}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.toggle input{width:18px;height:18px;accent-color:var(--gold)}
.code{font-family:var(--f-disp);font-size:56px;letter-spacing:.2em;color:var(--rare);font-weight:800;font-variant-numeric:tabular-nums}
.lobbybox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:420px;box-sizing:border-box}
.plist{display:flex;flex-direction:column;gap:6px;width:100%}
.plist div{display:flex;justify-content:space-between;background:#0f0b09;border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:14px}
.endtitle{font-family:var(--f-disp);font-size:clamp(28px,6vw,40px);font-weight:800;margin:10vh 0 0}
.endstats{display:grid;grid-template-columns:repeat(3,auto);gap:4px 22px;font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px;text-align:center}
.endstats b{display:block;color:var(--ink);font-size:20px}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
#hud button{pointer-events:auto}
.tl{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;width:min(220px,40vw)}
.meRow{display:flex;gap:8px;align-items:center}
.lv{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid var(--gold);background:#1a130d;display:grid;place-items:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.bars{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.bar{position:relative;height:12px;background:#0a0807;border:1px solid #3a2e24;border-radius:3px;overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:left;background:var(--hp)}
.bar.mp i{background:var(--mp)} .bar.xp{height:5px} .bar.xp i{background:var(--xp)}
.bar span{position:absolute;inset:0;font-size:9.5px;line-height:12px;text-align:center;font-variant-numeric:tabular-nums;color:#f6e9d8;text-shadow:0 1px 1px #000}
.ally{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--mute)}
.ally .bar{flex:1;height:8px}
.tc{position:absolute;left:50%;transform:translateX(-50%);top:max(8px,env(safe-area-inset-top));width:min(300px,38vw);display:flex;flex-direction:column;align-items:center;gap:4px}
#bVil{margin-top:2px;padding:6px 14px;min-height:34px;border-radius:17px;border:2px solid #d6aa4e;background:rgba(60,44,16,.9);color:#ffe7a8;font-weight:700;font-size:12.5px;box-shadow:0 0 14px rgba(214,170,78,.45)}
#bSkip{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;z-index:20;padding:11px 31px;min-height:64px;font-size:21px!important;border-radius:32px;border:2px solid #a3302a;background:rgba(70,16,12,.9);color:#ffd6c8;font-weight:700;font-size:12.5px}
#bVil.cool{border-color:#5a4634;color:#9a8c79;box-shadow:none;background:rgba(22,17,14,.85)}
#hWave{font-family:var(--f-disp);font-weight:800;font-size:15px;letter-spacing:.06em;color:#e9d9b4;text-shadow:0 1px 3px #000;white-space:nowrap}
.bar.vil{width:100%;height:12px} .bar.vil i{background:#8a6a3a}
.tr{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;gap:6px}
.hb{position:relative;width:42px;height:42px;border-radius:8px;background:rgba(22,17,14,.85);border:1px solid var(--line2);font-size:21px;font-weight:700;display:grid;place-items:center}
.badge{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:8px;background:var(--blood);font-size:10px;line-height:16px;padding:0 3px;box-sizing:border-box;font-variant-numeric:tabular-nums}
.orbs{position:absolute;inset:0;pointer-events:none}
.orb.hp{position:absolute;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom))}
.orb.mp{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom))}
.orb{width:86px;height:86px;border-radius:50%;overflow:hidden;background:#0b0807;border:3px solid #7a6038;box-shadow:0 0 0 2px #1a120b,0 4px 16px rgba(0,0,0,.7)}
.orb i{position:absolute;inset:0;transform-origin:bottom;transition:transform .15s;background:radial-gradient(circle at 40% 30%,#ff7563,#b8180f 55%,#4f0705)}
.orb.mp i{background:radial-gradient(circle at 40% 30%,#8fb0ff,#2346c4 55%,#0b1b58)}
.orb::after{content:'';position:absolute;left:18%;top:9%;width:40%;height:22%;border-radius:50%;background:rgba(255,255,255,.2);transform:rotate(-20deg)}
.orb span{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:0 1px 3px #000,0 0 6px #000;font-variant-numeric:tabular-nums;line-height:1.15}
.orb b{font-size:14px;font-weight:700;color:#fff}
.orb small{font-size:9.5px;color:#e8dccb}
@media (max-width:480px){.orb{width:72px;height:72px}.orb b{font-size:12px}}
.br{position:absolute;right:calc(max(10px,env(safe-area-inset-right)) + 96px);bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:10px}
#skills{display:grid;grid-template-columns:repeat(3,58px);gap:8px;direction:rtl}
.sb.press{transform:scale(.92)}
.sb .cdt{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums}
.sb.cd .nm{opacity:.35}
.sb{direction:ltr;position:relative;width:58px;height:58px;border-radius:50%;border:2px solid var(--c,#888);background:rgba(18,13,10,.82);font-size:12px;font-weight:700;padding:0;overflow:hidden;touch-action:none}
.sb .cdv{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.7) calc(var(--p,0)*1turn),transparent 0)}
.sb .lvn{position:absolute;bottom:3px;left:0;right:0;font-size:9px;color:var(--mute);font-variant-numeric:tabular-nums}
.sb .nm{position:relative;font-size:26px;line-height:1}
.sb.on{background:rgba(70,60,20,.85);box-shadow:0 0 12px var(--c)}
.sb.nomana{opacity:.45}
.sb.nofm{opacity:.4;filter:grayscale(.8)}
.atkcol{display:flex;flex-direction:column;align-items:center;gap:8px}
#bAtk{width:78px;height:78px;border-radius:50%;border:2px solid var(--blood);background:rgba(60,18,14,.85);font-family:var(--f-disp);font-weight:800;font-size:16px;touch-action:none}
#bPot{border:2px solid #b8322b}
.qb .lb b{font-style:normal;font-weight:900;font-size:12.5px;color:#ffd84a;text-shadow:0 1px 2px #000;margin-left:1px}.qb .lb.z b{color:#8a8277}
.qb #bPot,.qb #bRev{gap:0}.qb #bPot .ic,.qb #bRev .ic{margin-top:-1px}
#lvPen{position:absolute;left:10px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 168px);max-width:min(60vw,260px);padding:3px 8px;border-radius:6px;background:rgba(80,14,10,.82);border:1px solid #c0392b;color:#ffb3a6;font-size:11.5px;font-weight:700;line-height:1.35;pointer-events:none;z-index:5}#lvPen[hidden]{display:none}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--f-disp);font-weight:800;font-size:clamp(26px,6vw,44px);color:#efdcae;text-shadow:0 2px 12px #000,0 0 30px rgba(163,48,42,.6);opacity:0;transition:opacity .4s;pointer-events:none}
#banner small{display:block;font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--mute);margin-top:6px}
#dmgRank{margin-top:4px;width:max-content;min-width:118px;max-width:min(215px,52vw);pointer-events:none;font-size:11px;line-height:1.5;color:rgba(205,205,205,.62);text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.8);font-variant-numeric:tabular-nums;white-space:nowrap}
#dmgRank[hidden]{display:none}
#dmgRank div{display:flex;justify-content:space-between;gap:12px}#dmgRank b{font-weight:600}
body.hud-norank #dmgRank,body.hud-nocombo #combo,body.hud-nolvpen #lvPen{display:none!important}
.hudbox{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(12,9,8,.5)}
.hudbox>b{display:block;font-size:13px;margin-bottom:6px;color:#e9dcc3}
.hudbox label{display:flex;align-items:center;gap:10px;min-height:38px;font-size:13px;cursor:pointer}
.hudbox input{width:20px;height:20px;accent-color:#d6a43c;flex:none}
#toasts{position:absolute;right:10px;top:calc(max(8px,env(safe-area-inset-top)) + 112px);display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none;width:min(230px,58vw)}
.toast{background:rgba(12,9,8,.88);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:12px;text-align:right;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}#banner{transition:none}}

/* sheets */
.sheetwrap{position:absolute;inset:0;background:rgba(5,4,3,.72);z-index:30;display:flex;align-items:flex-start;justify-content:center;padding:max(10px,env(safe-area-inset-top)) 12px calc(56px + env(safe-area-inset-bottom));box-sizing:border-box}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:min(760px,100%);height:100%;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.sheet header h2{white-space:nowrap;font-family:var(--f-disp);font-weight:800;font-size:15px;margin:0;letter-spacing:.04em}
.sheet .x{background:none;border:1px solid var(--line2);border-radius:6px;width:36px;height:36px;font-size:18px}
.sbody{overflow:auto;touch-action:pan-y;padding:12px 14px;display:grid;gap:14px;flex:1 1 auto;min-height:0;align-content:start}
.bag{grid-template-columns:minmax(0,1fr)} /* 넓은 화면에서도 가방 전체 너비 사용 */
.up{position:absolute;right:2px;bottom:0;font-size:11px;line-height:1;font-style:normal;font-weight:900;color:#4dff6a;text-shadow:0 0 3px #000,0 0 3px #000,0 0 5px rgba(60,255,100,.7);z-index:2;pointer-events:none}.up.hi{bottom:13px}
.eq{display:grid;grid-template-columns:repeat(4,56px);gap:5px;align-content:start;justify-content:start}
.eq .slot{touch-action:pan-y;width:100%}.cell{touch-action:pan-y}
.slot,.cell{position:relative;aspect-ratio:1;max-width:100%;background:#0f0b09;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;padding:0}
.slot .sl{position:absolute;bottom:2px;left:0;right:0;font-size:9.5px;color:var(--mute);text-align:center}
.slot svg,.cell svg{width:58%;height:58%}
.cell.lock::after{content:'';position:absolute;inset:0;border-radius:5px;background:rgba(190,30,20,.13);pointer-events:none}
.nw{position:absolute;left:1px;bottom:0;font-size:8.5px;font-style:normal;font-weight:900;color:#fff;background:#d6382c;border-radius:4px;padding:0 3px;line-height:12px;z-index:2;box-shadow:0 0 4px rgba(255,80,60,.7)}.lk{position:absolute;left:1px;top:0;font-size:11px;font-style:normal;z-index:1;filter:drop-shadow(0 0 2px #000)}.rq{position:absolute;right:1px;bottom:0;font-size:9.5px;font-style:normal;font-weight:800;color:#fff;background:#a33a30;border-radius:4px;padding:0 3px;line-height:13px;z-index:1}
.slot.sel,.cell.sel{outline:2px solid var(--gold);outline-offset:1px}
.sktabs{display:flex;gap:8px}.sktabs button{flex:1;min-height:46px;border:1px solid var(--line2);border-radius:10px;background:#0f0b09;font-size:15px;font-weight:800}.sktabs button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:var(--panel2)}
#dock .hb[aria-pressed="true"]{border-color:var(--gold);background:var(--panel2)}#dock .hb[aria-pressed="true"] .lb{color:var(--gold)}
.sbody.bag .bagtop{position:sticky;top:-8px;z-index:3;background:var(--panel);padding:8px 0 6px;margin:-8px 0 0;box-shadow:0 6px 8px -4px rgba(0,0,0,.6)}.sbody.bag{padding:8px 12px;gap:8px}.sbody.bag .eq{grid-template-columns:repeat(7,minmax(0,64px));gap:4px;justify-content:start}.sbody.bag .inv{gap:4px;grid-template-columns:repeat(7,minmax(0,1fr))}.sbody.bag .eq .slot .sl{font-size:8.5px}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:5px;align-content:start}
.detail{background:#0f0b09;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13px;line-height:1.6;min-height:60px}
.detail .in{font-family:var(--f-disp);font-weight:800;font-size:17px}
.detail .meta{color:var(--mute);font-size:12px}
.detail ul{margin:6px 0;padding-left:16px;color:#a9b8ff}
.detail .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

function impact(x,y,rgb,r){ efx.push({k:'glow',x,y,r,rgb,t:0,life:.35}); }

function addNum(x,y,v,col,big){ nums.push({x:x+rand(-8,8),y,v,col,big,t:0}); if(nums.length>80)nums.shift(); }

/* ================= AUDIO ================= */
const AUD=(()=>{
  let ac=null,master=null,sfxG=null,musG=null,noiseBuf=null;
  const SFXKEYS=['swing','bolt','hit','crit','kill','boss','hurt','skill','boom','slam','pick','coin','potion','lvl','revive','ui','win','lose','vmagic','block','cast','fire','ice','zap','holy','aura','auraoff','shout','tele','rare'], samples={}; let mood='calm';
  const st={sfx:lsGet('dkdef2.sfx')!=='0',mus:lsGet('dkdef2.mus')!=='0'};
  function init(){
    if(ac){ if(ac.state==='suspended')ac.resume(); return; }
    try{
      ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain(); master.gain.value=.9; master.connect(ac.destination);
      sfxG=ac.createGain(); sfxG.gain.value=.7; sfxG.connect(master);
      musG=ac.createGain(); musG.gain.value=.22; musG.connect(master);
      const len=ac.sampleRate*1.8, ir=ac.createBuffer(2,len,ac.sampleRate); for(let c=0;c<2;c++){const d=ir.getChannelData(c); for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
      const cv=ac.createConvolver(); cv.buffer=ir; const rg=ac.createGain(); rg.gain.value=.32; cv.connect(rg); rg.connect(master); sfxG.connect(cv); musG.connect(cv);
      SFXKEYS.forEach(k=>{ fetch('audio/sfx/'+k+'.mp3').then(r=>{ if(!r.ok)throw 0; return r.arrayBuffer(); }).then(b=>ac.decodeAudioData(b)).then(buf=>{samples[k]=buf;}).catch(()=>{}); });
      noiseBuf=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      if(st.mus)musicStart();
    }catch(e){ac=null;}
  }
  function osc(type,f0,f1,dur,vol,delay,dest){
    if(!ac)return; const t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.setValueAtTime(f0,t); if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g); g.connect(dest||sfxG); o.start(t); o.stop(t+dur+.02);
  }
  function noise(dur,vol,fq,delay,type){
    if(!ac)return; const t=ac.currentTime+(delay||0), n=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
    n.buffer=noiseBuf; f.type=type||'bandpass'; f.frequency.value=fq; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    n.connect(f); f.connect(g); g.connect(sfxG); n.start(t); n.stop(t+dur+.02);
  }
  const lastT={};
  function sfx(k){
    if(!st.sfx||!ac)return; const now=ac.currentTime; if(lastT[k]&&now-lastT[k]<.04)return; lastT[k]=now;
    if(samples[k]){ const n=ac.createBufferSource(); n.buffer=samples[k]; n.playbackRate.value=.94+Math.random()*.12; n.connect(sfxG); n.start(); return; }
    switch(k){
    case 'swing': noise(.2,.6,1400); noise(.14,.4,3200,.03,'highpass'); osc('sawtooth',760,160,.16,.12); break;
    case 'bolt': case 'cast': osc('sine',500,1500,.2,.2); osc('triangle',1000,2100,.16,.12,.05); noise(.15,.18,4200,0,'highpass'); break;
    case 'fire': noise(.4,.55,900,0,'lowpass'); osc('sawtooth',180,520,.28,.16); noise(.2,.3,3000,.05,'highpass'); break;
    case 'ice': [1800,2400,3100].forEach((f,i)=>osc('sine',f,f*.8,.28,.13,i*.05)); noise(.2,.22,5200,0,'highpass'); break;
    case 'zap': osc('sawtooth',1600,200,.2,.2); osc('square',90,60,.22,.16); noise(.16,.45,4200,0,'highpass'); break;
    case 'holy': [659,880,1319].forEach((f,i)=>osc('sine',f,f,.55,.17,i*.07)); noise(.2,.12,5000,0,'highpass'); break;
    case 'aura': [392,523,659,784].forEach((f,i)=>osc('triangle',f,f*1.02,.55,.15,i*.07)); noise(.35,.14,2600,0,'highpass'); break;
    case 'auraoff': osc('triangle',520,240,.28,.14); break;
    case 'shout': osc('sawtooth',170,250,.45,.28); osc('square',85,120,.5,.22); noise(.3,.3,700); break;
    case 'rare': [880,1175,1568,2093].forEach((f,i)=>osc('sine',f,f,.5,.17,i*.08)); noise(.4,.1,6000,0,'highpass'); break;
    case 'tele': osc('sine',1300,180,.22,.22); osc('sine',180,1300,.22,.2,.2); noise(.3,.2,3000,0,'highpass'); break;
    case 'hit': noise(.09,.5,1200); osc('square',180,70,.08,.18); break;
    case 'crit': noise(.14,.7,900); osc('square',320,60,.16,.28); osc('sawtooth',900,200,.1,.12); break;
    case 'kill': noise(.2,.5,500); osc('sine',160,40,.25,.35); break;
    case 'boss': noise(.7,.7,300); osc('sawtooth',110,30,.8,.4); osc('square',70,35,.9,.3); break;
    case 'hurt': noise(.15,.5,400,0,'lowpass'); osc('sawtooth',200,60,.18,.25); break;
    case 'skill': osc('sawtooth',300,900,.25,.12); noise(.22,.25,2500,0,'highpass'); break;
    case 'boom': noise(.45,.8,260,0,'lowpass'); osc('sine',140,35,.5,.5); break;
    case 'slam': noise(.4,.7,200,0,'lowpass'); osc('sine',100,30,.45,.55); break;
    case 'pick': osc('sine',880,1320,.09,.16); osc('sine',1320,1760,.09,.12,.07); break;
    case 'coin': osc('square',1400,1400,.05,.1); osc('square',1900,1900,.09,.1,.05); break;
    case 'potion': osc('sine',400,700,.18,.2); osc('sine',500,900,.18,.14,.1); break;
    case 'lvl': [523,659,784,1047].forEach((f,i)=>osc('triangle',f,f,.3,.22,i*.1)); break;
    case 'revive': [392,523,659,784].forEach((f,i)=>osc('sine',f,f,.4,.22,i*.09)); break;
    case 'block': noise(.08,.4,3000,0,'highpass'); osc('square',900,500,.1,.2); break;
    case 'ui': osc('square',700,500,.05,.08); break;
    case 'win': [523,659,784,1047,1319].forEach((f,i)=>osc('triangle',f,f,.45,.22,i*.14)); break;
    case 'lose': [392,330,262,196].forEach((f,i)=>osc('sawtooth',f,f*.9,.5,.16,i*.2)); break;
    case 'vmagic': osc('sine',200,1200,.5,.25); noise(.5,.4,3000,0,'highpass'); break;
    }
  }
  /* 배경음: audio/bgm.mp3(평상), audio/battle.mp3(전투), audio/boss.mp3(보스) 가 있으면 그걸 쓰고, 없으면 자동 생성 음악 */
  const SRC={calm:'audio/bgm.mp3',battle:'audio/battle.mp3',boss:'audio/boss.mp3'}, ORDER={calm:['calm'],battle:['battle','calm'],boss:['boss','battle','calm']}, files={};
  const ROOTS=[110,87.31,130.81,98], BPM={calm:84,battle:116,boss:132}; let sIdx=0, procT=0, tmr=null, procOn=false, curFile=null;
  function note(type,f,t0,dur,vol,dest,lp,att){ const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.value=f; let n=o; if(lp){const fl=ac.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=lp; o.connect(fl); n=fl;}
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+(att||.02)); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); n.connect(g); g.connect(dest||musG); o.start(t0); o.stop(t0+dur+.05); }
  function nz(t0,dur,vol,fq,type){ const b=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain(); b.buffer=noiseBuf; f.type=type||'bandpass'; f.frequency.value=fq; g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); b.connect(f); f.connect(g); g.connect(musG); b.start(t0); b.stop(t0+dur+.02); }
  function kick(t0,v){ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.setValueAtTime(150,t0); o.frequency.exponentialRampToValueAtTime(40,t0+.12); g.gain.setValueAtTime(v,t0); g.gain.exponentialRampToValueAtTime(.001,t0+.25); o.connect(g); g.connect(musG); o.start(t0); o.stop(t0+.3); }
  function procTick(){
    if(!ac||!st.mus||!procOn)return;
    while(procT<ac.currentTime+.5){
      const sd=60/BPM[mood]/4, bar=Math.floor(sIdx/16)%4, s16=sIdx%16, root=ROOTS[bar], t0=procT, minor=[1,1.2,1.5,2], b=mood==='boss'?1.06:1;
      if(s16===0){ for(const m of [1,1.2,1.5]){ note('sawtooth',root*2*m,t0,sd*16,.16,musG,650,.5); note('sawtooth',root*2*m*1.005,t0,sd*16,.1,musG,650,.5);} if(mood==='boss')note('square',root*b*1.414,t0,sd*16,.05,musG,500,.4); }
      if(mood==='calm'){ if(s16%4===0)note('triangle',root*4*minor[(s16/4+bar)%4],t0,sd*3.5,.2,musG,2200,.03); if(s16===0||s16===8)note('sine',root/2,t0,sd*7,.4); }
      else { if(s16%2===0)note('triangle',root*4*minor[(s16/2)%4],t0,sd*1.8,.16,musG,2600,.01);
        if(s16%4===0||s16===6||s16===10)note('sawtooth',root/2,t0,sd*2.2,.3,musG,400,.01);
        if(s16%8===0||(mood==='boss'&&s16%4===0))kick(t0,.7); if(s16%8===4)nz(t0,.14,.5,1800); if(s16%2===0)nz(t0,.04,mood==='boss'?.28:.18,7000,'highpass'); }

    }
  }
  function pickFile(){ for(const m of ORDER[mood]){ if(files[m]===false)continue; if(!files[m]){ const a=new Audio(SRC[m]); a.loop=true; a.volume=.5; a.preload='auto'; files[m]=a; a.addEventListener('error',()=>{ files[m]=false; musicApply(); }); } return files[m]; } return null; }
  function musicApply(){
    if(!ac)return; const f=st.mus?pickFile():null;
    if(curFile&&curFile!==f){ try{curFile.pause();}catch(e){} }
    curFile=f;
    if(!st.mus){ procOn=false; return; }
    if(f){ procOn=false; const pr=f.play(); if(pr&&pr.catch)pr.catch(()=>{}); }
    else if(!procOn){ procOn=true; procT=ac.currentTime+.1; if(!tmr)tmr=setInterval(procTick,150); }
  }

let dragSup=0;
function enableDrag(b){
  b.addEventListener('click',e=>{ if(Date.now()<dragSup){ e.stopPropagation(); e.preventDefault(); } },true);
  b.querySelectorAll('[data-inv],[data-eq]').forEach(el=>{
    el.addEventListener('pointerdown',e=>{
      const src=el.dataset.inv!==undefined?{t:'inv',i:+el.dataset.inv}:{t:'eq',k:el.dataset.eq};
      const it=src.t==='inv'?me.inv[src.i]:me.eq[src.k]; if(!it)return;
      const sx=e.clientX, sy=e.clientY; let ghost=null, id=e.pointerId;
      const touch=e.pointerType==='touch'; let armed=!touch, dead=false, tm=null;
      const mk=()=>{ ghost=el.cloneNode(true); ghost.style.cssText+=';position:fixed;z-index:99999;pointer-events:none;opacity:.85;width:'+el.offsetWidth+'px;height:'+el.offsetHeight+'px;transform:scale(1.1)'; document.body.appendChild(ghost); el.style.opacity='.35'; };
      const tmv=ev=>{ if(armed&&touch&&ev.cancelable)ev.preventDefault(); };
      const clean=()=>{ dead=true; clearTimeout(tm); document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); document.removeEventListener('pointercancel',up); document.removeEventListener('touchmove',tmv); };
      if(touch) tm=setTimeout(()=>{ armed=true; mk(); ghost.style.left=(sx-el.offsetWidth/2)+'px'; ghost.style.top=(sy-el.offsetHeight/2)+'px'; if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){} },300);
      const mv=ev=>{ if(ev.pointerId!==id)return; const dist=Math.hypot(ev.clientX-sx,ev.clientY-sy);
        if(!armed){ if(dist>8){ clean(); } return; }
        if(!ghost){ if(dist<9)return; mk(); }
        ghost.style.left=(ev.clientX-el.offsetWidth/2)+'px'; ghost.style.top=(ev.clientY-el.offsetHeight/2)+'px'; if(ev.cancelable)ev.preventDefault(); };
      const up=ev=>{ if(ev.pointerId!==id)return; const wasG=ghost; clean();
        if(!ghost)return; ghost.remove(); el.style.opacity=''; dragSup=Date.now()+350;
        const t=document.elementFromPoint(ev.clientX,ev.clientY), dst=t&&t.closest('[data-inv],[data-eq]'); if(!dst){ renderBag(); return; }

      document.addEventListener('pointermove',mv,{passive:false}); document.addEventListener('pointerup',up); document.addEventListener('pointercancel',up); document.addEventListener('touchmove',tmv,{passive:false});

  if(a.t==='inv'&&b.t==='eq'){ const it=me.inv[a.i]; if(!it){renderBag();return;} const sl=it.slot==='ring'?(b.k.startsWith('ring')?b.k:null):it.slot; if(sl!==b.k&&!(it.slot==='ring'&&b.k.startsWith('ring'))){ toast('그 칸에는 착용할 수 없어요','#ff8a7a'); renderBag(); return; } equip(a.i,it.slot==='ring'?b.k:undefined); return; }

  modal(`<h3>☁️ 클라우드 저장</h3><div style="text-align:center;margin:4px 0 10px"><div class="meta">내 복구 코드</div><div id="clCode" style="font-family:ui-monospace,Menlo,monospace;font-size:17px;font-weight:800;letter-spacing:.5px;color:#ffe27a;margin:4px 0;user-select:all;-webkit-user-select:all">${esc(code)}</div><div class="meta" style="font-size:12px">마지막 저장 · ${clFmt(clAt())}${clMsg==='fail'?' · <span style="color:#ff8a7a">연결이 불안정해요. 다시 시도할게요</span>':''}</div></div><div class="col"><button class="btn primary" id="clCp">코드 복사</button><button class="btn" id="clNow">지금 저장</button><button class="btn" id="clLoad">🔑 다른 코드로 불러오기</button><button class="btn" id="clOff">연결 해제</button><button class="btn" id="clX">닫기</button></div><p class="note" style="margin-top:8px">변경은 10초 안에 자동 저장돼요. 코드를 잃어버리면 복구할 수 없으니 메모앱 등에 꼭 적어 두세요.</p>`,m=>{
    m.querySelector('#clX').onclick=closeModal; m.querySelector('#clLoad').onclick=clLoadModal;
    m.querySelector('#clCp').onclick=e=>clCopy(code,e.currentTarget);
    m.querySelector('#clNow').onclick=async e=>{ const b=e.currentTarget; b.disabled=true; b.textContent='저장하는 중…'; if(clT){clearTimeout(clT);clT=0;} const r=await clPut(); if(r==='conflict'){ clConflict(); return; } closeModal(); cloudModal(); };
    m.querySelector('#clOff').onclick=()=>modal(`<h3>연결을 해제할까요?</h3><p style="margin:0 0 12px;font-size:14px;line-height:1.5">이 기기는 더 이상 자동 저장하지 않아요. 서버에 저장된 데이터는 남아 있고, 코드로 다시 불러올 수 있어요.</p><div class="row2"><button class="btn" id="offN">취소</button><button class="btn primary" id="offY">해제</button></div>`,mm=>{ mm.querySelector('#offN').onclick=cloudModal; mm.querySelector('#offY').onclick=()=>{ clHook=null; if(clT){clearTimeout(clT);clT=0;} ['dkdef2.cl.code','dkdef2.cl.ver','dkdef2.cl.at'].forEach(lsDel); clHook=clDirty; cloudModal(); }; }); }); }
function clShowNew(c){ modal(`<h3>✅ 저장을 시작했어요</h3><p style="margin:0 0 8px;font-size:14px;line-height:1.55">아래가 <b>복구 코드</b>예요. 새 폰이나 새 아이콘에서 이 코드를 입력하면 캐릭터를 불러올 수 있어요. <b style="color:#ffb14a">메모앱 등에 꼭 적어 두세요.</b></p><div style="text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:17px;font-weight:800;color:#ffe27a;margin:10px 0;user-select:all;-webkit-user-select:all">${esc(c)}</div><div class="row2"><button class="btn primary" id="ncCp">코드 복사</button><button class="btn" id="ncX">확인</button></div>`,m=>{ m.querySelector('#ncCp').onclick=e=>clCopy(c,e.currentTarget); m.querySelector('#ncX').onclick=closeModal; }); }
function clLoadModal(){
  modal(`<h3>🔑 복구 코드로 불러오기</h3><p style="margin:0 0 8px;font-size:13.5px;line-height:1.5">저장해 둔 코드를 입력하세요. 불러오면 <b style="color:#ffb14a">이 기기의 현재 캐릭터는 서버 데이터로 바뀌어요.</b></p><input id="clIn" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="DG-XXXXX-XXXXX-XXXXX-XXXXX" style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid var(--line2);background:#120e0b;color:#fff;font-size:15px;text-align:center;font-family:ui-monospace,Menlo,monospace"><div id="clErr" class="meta" style="color:#ff8a7a;min-height:18px;margin:6px 0"></div><div class="row2"><button class="btn" id="lcX">취소</button><button class="btn primary" id="lcGo">불러오기</button></div>`,m=>{
    const inp=m.querySelector('#clIn'), err=m.querySelector('#clErr'); setTimeout(()=>inp.focus(),50);
    m.querySelector('#lcX').onclick=()=>{ clCode()?cloudModal():closeModal(); };
    const go=async()=>{ const c=clNorm(inp.value); if(!c){ err.textContent='코드를 다시 확인해 주세요 (DG-로 시작하는 24자)'; return; } const b=m.querySelector('#lcGo'); b.disabled=true; b.textContent='불러오는 중…'; err.textContent='';
      try{ const res=await clRpc('dd_save_get',{p_code:c}); if(!res||!res.data){ err.textContent='이 코드로 저장된 데이터를 찾지 못했어요'; b.disabled=false; b.textContent='불러오기'; return; } clApply(res,c); }
      catch(e){ err.textContent='연결에 실패했어요. 잠시 후 다시 눌러보세요'; b.disabled=false; b.textContent='불러오기'; } };
    m.querySelector('#lcGo').onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter')go(); }; }); }
let clBooted=false; function clBoot(){ if(clBooted)return; clBooted=true; if(clCode())setTimeout(clCheck,1200); }
fxAtlas(); applyHud(); show('#sTitle'); renderClassCards(); clBoot();
requestAnimationFrame(step);
})();
